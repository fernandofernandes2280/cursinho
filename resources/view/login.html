<div class="login-modern-page">
  <div class="login-toast-slot" aria-live="polite" aria-atomic="true">{{status}}</div>

  <section class="login-modern-card" aria-labelledby="login-title">
    <div class="login-brand-row">
      <span class="login-brand-mark">
        <img src="{{URL}}/resources/assets/img/preparasantana_semfundo.png" alt="Prepara Santana">
      </span>
      <div class="login-brand-copy">
        <p>Acesso administrativo</p>
        <h1 id="login-title">Cursinho Preparatório Prof. Anunciação</h1>
      </div>
    </div>

    <form action="" method="post" class="login-modern-form">
      <div class="login-field">
        <label for="cpf">CPF</label>
        <div class="login-input-wrap">
          <span class="material-icons" aria-hidden="true">badge</span>
          <input class="form-control-pessoal mascara-cpf cpfLogin" required type="text" id="cpf" value="" name="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00">
        </div>
      </div>

      <div class="login-field">
        <label for="senha">Senha</label>
        <div class="login-input-wrap">
          <span class="material-icons" aria-hidden="true">lock</span>
          <input type="password" name="senha" id="senha" class="form-control-pessoal auth-password" autocomplete="current-password" placeholder="Digite sua senha">
          <button type="button" class="login-password-toggle" rel="tooltip" title="Ver senha" aria-label="Mostrar ou ocultar senha">
            <span class="material-icons" aria-hidden="true">visibility</span>
          </button>
        </div>
      </div>

      <button type="submit" class="login-primary-button" rel="tooltip" title="Entrar no sistema">
        <span class="material-icons" aria-hidden="true">login</span>
        Entrar
      </button>

      <div class="login-footer-actions">
        <a href="{{URL}}/">Voltar</a>
        <a href="{{URL}}/login/recuperarSenha">Recuperar senha</a>
      </div>
    </form>
  </section>
</div>

<script>
  (function() {
    var toggle = document.querySelector('.login-password-toggle');
    var input = document.querySelector('#senha');
    var form = document.querySelector('.login-modern-form');
    var submit = document.querySelector('.login-primary-button');

    function bloquearSubmit() {
      if (!submit || submit.disabled) {
        return;
      }

      submit.disabled = true;
      submit.setAttribute('aria-busy', 'true');
      submit.innerHTML = '<span class="material-icons" aria-hidden="true">hourglass_top</span>Entrando...';
    }

    if (toggle && input) {
      toggle.addEventListener('click', function() {
        var isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        toggle.querySelector('.material-icons').textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (form && submit) {
      form.addEventListener('submit', function() {
        bloquearSubmit();
      });
    }

    if (document.querySelector('.login-toast-slot [data-toast-redirect]')) {
      bloquearSubmit();
    }
  })();
</script>
