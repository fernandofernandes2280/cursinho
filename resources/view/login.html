<div class="auth-page">
  <div class="auth-panel">
    <div class="card card-login mx-auto text-center">
      <div class="auth-logo">
        <img src="{{URL}}/resources/assets/img/preparasantana.png" height="80" alt="Prepara Santana">
      </div>

      <div class="card-body">
        <form action="" method="post" class="auth-form">
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span>CPF</span>
            </div>
            <input class="form-control-pessoal mascara-cpf cpfLogin" required type="text" id="cpf" value="" name="cpf">
          </div>

          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span>Senha</span>
            </div>
            <input type="password" name="senha" id="senha" class="form-control-pessoal auth-password" placeholder="Senha">
            <span class="lnr lnr-eye h2 text-dark" rel="tooltip" title="ver senha"></span>
          </div>

          <div class="form-group auth-actions">
            <a href="{{URL}}/" class="btn btn-warning btn-sm" rel="tooltip" title="Voltar para Home">Voltar</a>
            <input type="submit" value="Entrar" class="btn-entrar btn btn-success login_btn btn-sm" rel="tooltip" title="Entrar no sistema">
          </div>
        </form>

        <div class="auth-help">
          <a href="{{URL}}/login/recuperarSenha">Recuperar Senha</a>
        </div>
      </div>
    </div>

    {{status}}
  </div>
</div>

<style>
  .lnr-eye {
    position: absolute;
    top: 5px;
    right: 10px;
    cursor: pointer;
  }
</style>
<script>
  let btn = document.querySelector('.lnr-eye');
  btn.addEventListener('click', function() {
    let input = document.querySelector('#senha');
    if (input.getAttribute('type') == 'password') {
      input.setAttribute('type', 'text');
    } else {
      input.setAttribute('type', 'password');
    }
  });
</script>
