<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="{{URL}}/resources/assets/img/icone-cursinho.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>{{title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Icons" />
  <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{URL}}/resources/css/tailwind-dashboard.css?v=82" rel="stylesheet">

  <script src="{{URL}}/resources/assets/js/core/jquery.min.js"></script>
  <script src="{{URL}}/resources/js/qrcode/html5-qrcode.min.js"></script>
</head>

<body class="light-edition">
  <div class="wrapper">
    {{content}}

    <div class="modal fade" id="modalNovoCpfAluno" tabindex="-1" aria-labelledby="modalNovoCpfAlunoLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content modal-content-aluno">
          <form method="get" action="{{URL}}/alunos/new">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNovoCpfAlunoLabel">Informe o CPF do novo Aluno:</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <label for="cpfAluno">CPF:</label>
              <input class="form-control-pessoal mascara-cpf cpfNovo" {{readonly}} required type="text" id="cpfAluno" name="cpfAluno" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Fechar">
                <i class="material-icons">close</i>
              </button>
              <button type="submit" class="btn btn-success btn-round btn-just-icon" id="novoAluno" rel="tooltip" title="Confirmar">
                <i class="material-icons">description</i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalNovoCpfProfessor" tabindex="-1" aria-labelledby="modalNovoCpfProfessorLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content modal-content-professor">
          <form method="get" action="{{URL}}/professores/new">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNovoCpfProfessorLabel">Informe o CPF do novo Professor:</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <label for="cpfProfessor">CPF:</label>
              <input class="form-control-pessoal mascara-cpf cpfNovo" {{readonly}} required type="text" id="cpfProfessor" name="cpfProfessor" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Fechar">
                <i class="material-icons">close</i>
              </button>
              <button type="submit" class="btn btn-success btn-round btn-just-icon" rel="tooltip" id="novoProfessor" title="Confirmar">
                <i class="material-icons">description</i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalNovoCpfUser" tabindex="-1" aria-labelledby="modalNovoCpfUserLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content modal-content-user">
          <form method="get" action="{{URL}}/users/new">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNovoCpfUserLabel">Informe o CPF do novo Usuário:</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <label for="cpfUser">CPF:</label>
              <input class="form-control-pessoal mascara-cpf cpfNovo" {{readonly}} required type="text" id="cpfUser" name="cpfUser" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Fechar">
                <i class="material-icons">close</i>
              </button>
              <button type="submit" class="btn btn-success btn-round btn-just-icon" rel="tooltip" id="novoUser" title="Confirmar">
                <i class="material-icons">description</i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="{{URL}}/resources/js/jquery.mask.js"></script>
  <script src="{{URL}}/resources/js/pages.js?v=61"></script>
  <script src="{{URL}}/resources/js/jquery.plugin.html2canvas.js"></script>
  <script src="{{URL}}/resources/js/html2canvas.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var body = document.body;
      var toggle = document.getElementById('sidebarToggle');
      var compactQuery = window.matchMedia('(max-width: 1023px)');

      function setSidebar(open) {
        if (!compactQuery.matches) {
          body.classList.toggle('sidebar-collapsed', !open);
          body.classList.remove('sidebar-open');
          if (!toggle) return;
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          toggle.setAttribute('title', open ? 'Ocultar painel lateral' : 'Exibir painel lateral');
          var desktopIcon = toggle.querySelector('.material-icons');
          if (desktopIcon) desktopIcon.textContent = open ? 'menu_open' : 'menu';
          return;
        }

        body.classList.remove('sidebar-collapsed');
        body.classList.toggle('sidebar-open', open);
        if (!toggle) return;
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('title', open ? 'Ocultar painel lateral' : 'Exibir painel lateral');
        var icon = toggle.querySelector('.material-icons');
        if (icon) icon.textContent = open ? 'menu_open' : 'menu';
      }

      function isSidebarOpen() {
        if (!compactQuery.matches) {
          return !body.classList.contains('sidebar-collapsed');
        }

        return body.classList.contains('sidebar-open');
      }

      setSidebar(!compactQuery.matches);

      function handleCompactChange() {
        setSidebar(!compactQuery.matches);
      }

      if (compactQuery.addEventListener) {
        compactQuery.addEventListener('change', handleCompactChange);
      } else if (compactQuery.addListener) {
        compactQuery.addListener(handleCompactChange);
      }

      if (toggle) {
        toggle.addEventListener('click', function() {
          setSidebar(!isSidebarOpen());
        });
      }

      function openModal(selector) {
        var modal = document.querySelector(selector);
        if (!modal) return;
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
        var input = modal.querySelector('input, select, textarea, button');
        if (input) setTimeout(function() { input.focus(); }, 50);
      }

      function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      }

      document.addEventListener('click', function(event) {
        var modalTrigger = event.target.closest('[data-toggle="modal"][data-target]');
        if (modalTrigger) {
          event.preventDefault();
          openModal(modalTrigger.getAttribute('data-target'));
          return;
        }

        var dismiss = event.target.closest('[data-dismiss="modal"]');
        if (dismiss) {
          event.preventDefault();
          closeModal(dismiss.closest('.modal'));
          return;
        }

        if (event.target.classList.contains('modal')) {
          closeModal(event.target);
          return;
        }

        var dropdownToggle = event.target.closest('.dropdown-toggle');
        if (dropdownToggle) {
          event.preventDefault();
          var dropdown = dropdownToggle.closest('.dropdown');
          var menu = dropdown ? dropdown.querySelector('.dropdown-menu') : null;
          if (menu) menu.classList.toggle('show');
          if (dropdown) dropdown.classList.toggle('open');
          return;
        }

        document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) {
          if (!menu.closest('.dropdown').contains(event.target)) {
            menu.classList.remove('show');
            menu.closest('.dropdown').classList.remove('open');
          }
        });
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          document.querySelectorAll('.modal.show').forEach(closeModal);
        }
      });

      [['.modal-content-aluno', '#novoAluno'], ['.modal-content-professor', '#novoProfessor'], ['.modal-content-user', '#novoUser']].forEach(function(pair) {
        var content = document.querySelector(pair[0]);
        var button = document.querySelector(pair[1]);
        if (!content || !button) return;
        content.addEventListener('keypress', function(event) {
          if (event.which === 13 || event.key === 'Enter') {
            event.preventDefault();
            button.click();
          }
        });
      });
    });
  </script>
</body>

</html>
