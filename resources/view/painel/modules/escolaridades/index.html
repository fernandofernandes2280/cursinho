<main class="list-page">
  <section class="list-panel">
    <div class="list-toolbar">
      <div class="list-title">
        <h5>{{title}}</h5>
      </div>
      <div class="list-status">
        {{statusMessage}}
        {{status}}
      </div>
      <div class="list-actions">
        <a href="{{URL}}/escolaridades/new" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Nova Escolaridade">
          <i class="material-icons">add</i>
        </a>
        <a href="{{URL}}/escolaridades" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
          <i class="material-icons">reply</i>
        </a>
      </div>
    </div>
  </section>

  <div class="table-responsive list-table-wrap">
    <table class="table table-striped list-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th style="width:200px">Ações</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </div>

  <div class="list-footer">
    <div class="list-pagination">
      {{pagination}}
    </div>
  </div>
</main>
