<div class="photo-capture-page">
  <div class="photo-capture-header">
    <div>
      <h5>{{title}}</h5>
      <p>{{aluno}}</p>
    </div>

    <a href="javascript:history.back()" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
      <i class="material-icons">reply</i>
    </a>
  </div>

  <form method="post" enctype="multipart/form-data" class="photo-capture-form" data-photo-capture data-photo-max-size="5242880">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="image" class="image-tag" data-photo-image>
    <input type="file" id="flImage" name="fImage" accept="image/*" class="photo-capture-file" data-photo-file>

    <div class="photo-capture-grid">
      <section class="photo-capture-panel">
        <div class="photo-capture-panel-header">
          <strong>Câmera</strong>
          <span data-photo-status>Solicitando acesso à câmera...</span>
        </div>

        <div class="photo-capture-stage photo-capture-camera">
          <video autoplay muted playsinline data-photo-video></video>
          <div class="photo-capture-frame" aria-hidden="true">
            <span>Centralize o rosto</span>
          </div>
        </div>

        <div class="photo-capture-actions">
          <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Capturar" data-photo-capture-action>
            <i class="material-icons">photo_camera</i>
          </button>
          <button type="button" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Escolher arquivo" data-photo-file-trigger>
            <i class="material-icons">upload_file</i>
          </button>
        </div>
      </section>

      <section class="photo-capture-panel">
        <div class="photo-capture-panel-header">
          <strong>Pré-visualização</strong>
          <span data-photo-preview-status>Aguardando captura</span>
        </div>

        <div class="photo-capture-stage photo-capture-preview">
          <canvas data-photo-canvas hidden></canvas>
          <img alt="Pré-visualização da foto" data-photo-preview hidden>
          <div class="photo-capture-placeholder" data-photo-placeholder>
            <i class="material-icons" aria-hidden="true">portrait</i>
            <span>Sua foto aparecerá aqui</span>
          </div>
        </div>

        <div class="photo-capture-actions">
          <button type="button" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Tirar outra foto" data-photo-retake>
            <i class="material-icons">refresh</i>
          </button>
          <button type="submit" class="btn btn-info btn-round btn-just-icon" rel="tooltip" title="Salvar Foto">
            <i class="material-icons">save</i>
          </button>
        </div>
      </section>
    </div>
  </form>
</div>

<script src="{{URL}}/resources/js/photo-capture.js?v=2"></script>
