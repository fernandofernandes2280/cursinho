<main class="alunos-page">
  <section id="pesquisa" class="alunos-panel">
      <div class="alunos-toolbar">
        <div class="alunos-title">
          <h5>{{title}}</h5>
        </div>
        <div class="alunos-status">
          {{statusMessage}}
        </div>
        <div class="alunos-actions">

          <a href="{{URL}}/alunos/relatorios" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Imprimir" target="_blank">
            <i class="material-icons">print</i>
          </a>
          <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Novo" data-toggle="modal" data-target="#modalNovoCpfAluno">
            <i class="material-icons">person_add</i>
          </button>
        </div>
      </div>
  </section>

  <section class="alunos-datatable-panel">
    <table
      id="datatablesSimple"
      class="table table-striped alunos-table"
      data-caption="Listagem de alunos cadastrados"
      data-entity-singular="aluno"
      data-entity-plural="alunos"
      data-placeholder="Buscar aluno..."
      data-search-title="Buscar na listagem de alunos"
      data-name-column="1"
      data-status-column="4"
      data-actions-column="5"
    >
      <caption>Listagem de alunos cadastrados</caption>
      <thead>
        <tr>
          <th data-type="string">Matrícula</th>
          <th data-type="html">Nome</th>
          <th data-type="string">Turma</th>
          <th data-type="string">CPF</th>
          <th data-type="html">Status</th>
          <th data-type="html" data-sortable="false" data-searchable="false">Ações</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </section>
</main>


<!-- teste com ajax -->
<section class="users" hidden>

    <article class="users_user">
        <h3>TESTE DE AJAX</h3>
        <a class="remove" href="#" data-action="{{URL}}/delete" data-id="3">Deletar</a>
        </article>

</section>
