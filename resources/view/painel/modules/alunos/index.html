
<main class="alunos-page">
  <section id="pesquisa" class="alunos-panel">
    <form method="get" id="form" class="alunos-search-form">
      <div class="alunos-toolbar">
        <div class="alunos-title">
          <h5>{{title}}</h5>
        </div>
        <div class="alunos-status">
          {{statusMessage}}
        </div>
        <div class="alunos-actions">
          <button type="submit" class="btn btn-facebook btn-round btn-just-icon" rel="tooltip" title="Pesquisar">
            <i class="material-icons">search</i>
          </button>
          <a href="{{URL}}/alunos/relatorios" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Imprimir" target="_blank">
            <i class="material-icons">print</i>
          </a>
          <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Novo" data-toggle="modal" data-target="#modalNovoCpfAluno">
            <i class="material-icons">person_add</i>
          </button>
        </div>
      </div>

      <div class="alunos-filters">
        <div class="alunos-field alunos-field-sm">
          <label for="matricula">Matrícula</label>
          <input type="text" name="matricula" id="matricula" class="form-control-pessoal matricula" value="{{matricula}}">
        </div>
        <div class="alunos-field alunos-field-lg">
          <label for="nome">Nome</label>
          <input type="text" name="nome" id="nome" class="form-control-pessoal" value="{{nome}}">
        </div>
        <div class="alunos-field alunos-field-sm">
          <label for="cpfPesq">CPF</label>
          <input type="text" name="cpfPesq" id="cpfPesq" class="form-control-pessoal mascara-cpf cpfPesquisa" value="{{cpf}}">
        </div>
        <div class="alunos-field alunos-field-sm">
          <label for="turma">Turma</label>
          <select class="custom-select" id="turma" name="turma">
            <option value="">Todas</option>
            {{optionTurma}}
          </select>
        </div>
        <div class="alunos-field alunos-field-sm">
          <label for="status">Status</label>
          <select name="status" id="status" class="custom-select">
            <option value="" {{selectedAtIn}}>Todos</option>
            {{optionStatus}}
          </select>
        </div>
      </div>
    </form>
  </section>

  <div class="table-responsive alunos-table-wrap">
    <table class="table table-striped alunos-table">
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Turma</th>
          <th>CPF</th>
          <th>Autor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </div>

  <div class="alunos-footer">
    <div class="alunos-pagination">
      {{pagination}}
    </div>
    <span class="alunos-total">Total: {{total}}</span>
  </div>
</main>


<!-- teste com ajax -->

    <article class="users_user">
        <h3>TESTE DE AJAX</h3>
        <a class="remove" href="#" data-action="{{URL}}/delete" data-id="3">Deletar</a>
        </article>
    
</section>
