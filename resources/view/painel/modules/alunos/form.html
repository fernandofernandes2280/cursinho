<form method="post" class="aluno-form">
  <div class="row aluno-form-header">
    <div class="col-md-3">
      <h5>{{title}}</h5>
    </div>
    <div class="col-md-4">
      {{statusMessage}}
    </div>

    <div class="col-md-5 text-right form-actions">
      <a href="{{URL}}/alunos/{{id}}/carteira" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Imprimir Carteira de Estudante">
        <i class="material-icons">badge</i>
      </a>
      <a href="#" target="_blank" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Imprimir Capa">
        <i class="material-icons">print</i>
      </a>
      <a href="{{URL}}/frequencias/{{idAula}}/edit/individual/{{idAluno}}" class="btn btn-primary btn-round btn-just-icon" rel="tooltip" title="Selecionar Para Frequência" {{hideBtnFreq}}>
        <i class="material-icons">how_to_reg</i>
      </a>
      <button class="btn btn-facebook btn-round btn-just-icon" type="submit" rel="tooltip" title="Salvar">
        <i class="material-icons">save</i>
      </button>
      <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" id="novo" title="Novo" data-toggle="modal" data-target="#modalNovoCpfAluno">
        <i class="material-icons">person_add</i>
      </button>
      <a href="javascript:history.back()" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
        <i class="material-icons">reply</i>
      </a>
    </div>
  </div>

  <div class="aluno-form-body">
    <div class="aluno-fields-grid">
      <div class="aluno-photo-box">
        <a href="{{URL}}/alunos/photo/{{id}}" style="{{ponteiro}}">
          <img title="Carregar nova foto" alt="Foto" rel="tooltip" src="{{URL}}/app/Controller/File/files/fotos/{{foto}}">
        </a>
      </div>

      <div class="aluno-form-meta">
        <label class="h5">Matrícula:</label>
        <span class="h5 aluno-matricula-value">{{matricula}}</span>
      </div>

      <div class="aluno-field aluno-field-nome">
        <label for="nome">Nome</label>
        <input type="text" class="form-control-pessoal" id="nome" name="nome" value="{{nome}}" required>
      </div>
      <div class="aluno-field aluno-field-cep">
        <label for="cep">Cep</label>
        <input type="text" class="form-control-pessoal" data-action="{{URL}}/delete" data-id="3" id="cep" name="cep" value="{{cep}}">
      </div>

      <div class="aluno-field aluno-span-5">
        <label for="endereco">Endereço</label>
        <small class="text-muted">logradouro (rua, avenida, ..)</small>
        <input type="text" class="form-control-pessoal" id="endereco" name="endereco" value="{{endereco}}">
      </div>
      <div class="aluno-field aluno-span-1">
        <label for="numero">Nº</label>
        <input type="text" class="form-control-pessoal" id="numero" name="numero" value="{{numero}}">
      </div>
      <div class="aluno-field aluno-span-3">
        <label for="bairro">Bairro</label>
        <select class="custom-select" id="bairro" name="bairro">
          {{optionBairros}}
        </select>
      </div>
      <div class="aluno-field aluno-span-2">
        <label for="cidade">Cidade</label>
        <input type="text" class="form-control-pessoal" id="cidade" name="cidade" value="{{cidade}}">
      </div>
      <div class="aluno-field aluno-span-1">
        <label for="uf">UF</label>
        <input type="text" class="form-control-pessoal" id="uf" name="uf" value="{{uf}}">
      </div>

      <div class="aluno-field aluno-span-4">
        <label for="naturalidade">Naturalidade</label>
        <input type="text" class="form-control-pessoal" id="naturalidade" name="naturalidade" value="{{naturalidade}}">
      </div>
      <div class="aluno-field aluno-span-3">
        <label for="escolaridade">Escolaridade</label>
        <select class="custom-select" id="escolaridade" name="escolaridade">
          {{optionEscolaridade}}
        </select>
      </div>
      <div class="aluno-field aluno-span-3">
        <label for="estadoCivil">Estado Civil</label>
        <select class="custom-select" id="estadoCivil" name="estadoCivil">
          {{optionEstadoCivil}}
        </select>
      </div>
      <div class="aluno-field aluno-span-2">
        <label for="sexo">Sexo</label>
        <select class="custom-select" id="sexo" name="sexo">
          <option {{selectedSexoM}} value="MAS">MAS</option>
          <option {{selectedSexoF}} value="FEM">FEM</option>
        </select>
      </div>

      <div class="aluno-field aluno-span-2">
        <label for="dataNasc">Data Nascimento</label>
        <input type="date" class="form-control-pessoal" id="dataNasc" name="dataNasc" value="{{dataNasc}}">
      </div>
      <div class="aluno-field aluno-span-2">
        <label for="dataCad">Data Cadastro</label>
        <input type="date" class="form-control-pessoal" id="dataCad" name="dataCad" value="{{dataCad}}">
      </div>
      <div class="aluno-field aluno-span-3">
        <label for="fone">Telefone</label>
        <small class="text-muted">(ddd) + seu número</small>
        <input type="text" class="form-control-pessoal mascara-telefone" id="fone" name="fone" value="{{fone}}" maxlength="11">
      </div>
      <div class="aluno-field aluno-span-2">
        <label for="cpf">CPF:</label>
        <input class="form-control-pessoal cpfAluno mascara-cpf" required type="text" id="cpf" value="{{cpf}}" name="cpf">
      </div>
      <div class="aluno-field aluno-span-3">
        <label for="turma">Turma</label>
        <select class="custom-select" id="turma" name="turma">
          {{optionTurma}}
        </select>
      </div>

      <div class="aluno-field aluno-span-4">
        <label for="mae">Mãe</label>
        <input type="text" class="form-control-pessoal" id="mae" name="mae" value="{{mae}}">
      </div>
      <div class="aluno-field aluno-span-2">
        <label for="status">Status</label>
        <select class="custom-select" id="status" name="status" required>
          {{optionStatus}}
        </select>
      </div>
      <div class="aluno-field aluno-span-6">
        <label for="obs">Observações</label>
        <input type="text" class="form-control-pessoal" id="obs" name="obs" value="{{obs}}">
      </div>
    </div>
  </div>
</form>

<script>
  $('#fone').keyup(function() {
    $(this).val(this.value.replace(/\D/g, ''));
  });
</script>
