<tr data-aluno-id="{{id}}">
  <td class="alunos-matricula" data-label="Matrícula">{{matricula}}</td>
  <td class="student-name-column" data-label="Nome">
    <div class="student-cell">
      <button type="button" class="student-photo-button" data-toggle="modal" data-target="#modalStudentPhoto" data-photo-src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" rel="tooltip" title="Ampliar foto">
        <img src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" class="student-avatar" alt="Foto de {{nome}}">
      </button>
      <a href="{{URL}}/alunos/{{id}}/edit" class="student-name-link" rel="tooltip" title="Editar aluno">{{nome}}</a>
    </div>
  </td>
  <td class="text-center" data-label="Status"><span class="student-status-pill {{statusCor}}">{{status}}</span><span class="datatable-status-token" data-report-exclude="true"> statusfilter{{statusToken}} </span></td>
  <td class="text-center" data-label="Turma"><span>{{turma}}</span></td>
  <td class="text-center" data-label="CPF"><span>{{cpf}}</span></td>
  <td class="text-center" data-label="Telefone"><span>{{fone}}</span></td>
  <td data-label="Endereço"><span>{{endereco}}</span></td>
  <td class="text-center" data-label="Escolaridade"><span>{{escolaridade}}</span></td>
  <td class="text-center" data-label="Sexo"><span>{{sexo}}</span></td>
  <td class="text-center" data-label="Nascimento"><span>{{dataNasc}}</span></td>
  <td class="text-center" data-label="Cadastro"><span>{{dataCad}}</span></td>
  <td data-label="Mãe"><span>{{mae}}</span></td>
  <td data-label="Ações">
    <div class="row-actions">
      <a href="{{URL}}/alunos/{{id}}/edit" class="table-action" rel="tooltip" title="Editar">
        <i class="material-icons">edit</i>
      </a>
      <button
        type="button"
        class="table-action table-action-danger"
        rel="tooltip"
        title="Excluir"
        data-toggle="modal"
        data-target="#modalDeleteRecord"
        data-delete-url="{{deleteUrl}}"
        data-delete-redirect="{{URL}}/alunos"
        data-delete-title="Excluir aluno"
        data-delete-warning="O aluno, seus uploads e vínculos de frequência serão removidos."
        data-delete-detail-matricula="{{matriculaAttr}}"
        data-delete-detail-nome="{{nomeAttr}}"
        data-delete-detail-cpf="{{cpfAttr}}"
        data-delete-detail-turma="{{turmaAttr}}"
        data-delete-detail-status="{{statusAttr}}"
        {{visivelDeleteAluno}}
      >
        <i class="material-icons">delete</i>
      </button>
    </div>
  </td>
</tr>
