<tr>
  <td class="alunos-matricula">{{matricula}}</td>
  <td>
    <a href="{{URL}}/alunos/{{id}}/edit" class="student-cell" rel="tooltip" title="Visualizar">
      <img src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" class="student-avatar" alt="foto">
      <span class="student-name-pill {{cor}}">{{nome}}</span>
    </a>
  </td>
  <td class="text-center"><span>{{turma}}</span></td>
  <td class="text-center"><span>{{cpf}}</span></td>
  <td class="text-center"><span>{{autor}}</span></td>
  <td>
    <div class="row-actions">
      <a href="{{URL}}/alunos/{{id}}/edit" class="table-action" rel="tooltip" title="Visualizar">
        <i class="material-icons">visibility</i>
      </a>
      <a href="{{URL}}/alunos/{{id}}/delete" class="table-action table-action-danger" rel="tooltip" title="Excluir" {{visivelDeleteAluno}}>
        <i class="material-icons">delete</i>
      </a>
    </div>
  </td>
</tr>
