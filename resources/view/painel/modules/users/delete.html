
<h5>Excluir Usuário</h5>

<hr>

				
			<div class="form-actions">
			<a href="{{URL}}/users" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
				<i class="material-icons">reply</i>
		</a>
			</div>
<hr>


<form method="post">
	<div class="form-group">
	Você deseja realmente excluir o usuário <b>{{nome}} ( {{email}} )</b> ?
	</div>

	
	<div class="form-group mt-3 form-actions">
		<button type="submit" class="btn btn-danger btn-round btn-just-icon" rel="tooltip" title="Excluir">
			<i class="material-icons">delete</i>
		</button>
	</div>

</form>
