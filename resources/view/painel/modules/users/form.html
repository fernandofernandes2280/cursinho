<form method="post" class="user-form">
  <div class="row user-form-header">
    <div class="col-md-3">
      <h5>{{title}}</h5>
    </div>
    <div class="col-md-5">
      {{statusMessage}}
    </div>

    <div class="col-md-4 text-right form-actions">
      <button class="btn btn-facebook btn-round btn-just-icon" type="submit" rel="tooltip" title="Salvar">
        <i class="material-icons">save</i>
      </button>
      <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" {{btnNovoUsuarioVisivel}} title="Novo" data-toggle="modal" data-target="#modalNovoCpfUser">
        <i class="material-icons">person_add</i>
      </button>
      <a href="javascript:history.back()" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
        <i class="material-icons">reply</i>
      </a>
    </div>
  </div>

  <div class="user-form-body">
    <div class="user-fields-grid">
      <div class="user-photo-box">
        <a href="{{URL}}/users/photo/{{id}}" style="{{ponteiro}}">
          <img title="Carregar nova foto" alt="Foto" rel="tooltip" src="{{URL}}/app/Controller/File/files/fotos/{{foto}}">
        </a>
      </div>

      <div class="user-field user-field-nome">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" class="form-control-pessoal" value="{{nome}}" required>
      </div>
      <div class="user-field user-field-email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control-pessoal" value="{{email}}" required>
      </div>

      <div class="user-field user-span-3">
        <label for="cpf">CPF:</label>
        <input {{habilitado}} class="form-control-pessoal cpfUser mascara-cpf" required type="text" id="cpf" value="{{cpf}}" name="cpf">
      </div>
      <div class="user-field user-span-3">
        <label for="tipo">Tipo</label>
        <select {{habilitado}} class="custom-select" id="tipo" name="tipo">
          <option {{selectedAdmin}} value="Admin">Admin</option>
          <option {{selectedOperador}} value="Operador">Operador</option>
          <option {{selectedVisitante}} value="Visitante">Visitante</option>
        </select>
      </div>
      <div class="user-field user-span-3 user-password-field">
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" class="form-control-pessoal" {{required}} value="{{senha}}">
        <span class="lnr lnr-eye user-password-toggle" rel="tooltip" title="Ver senha" data-target="#senha"></span>
      </div>
      <div class="user-field user-span-1 form-actions form-actions-start">
        <a href="{{URL}}/trocarSenha" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Trocar Senha">
          <i class="material-icons">edit_note</i>
        </a>
      </div>
    </div>
  </div>

  <div class="user-permissions" {{permissoesVisivel}}>
    <label>PERMISSÕES:</label>
    {{permissionGroups}}
  </div>
</form>

<script>
  document.querySelectorAll('.user-password-toggle').forEach(function(toggle) {
    toggle.addEventListener('click', function() {
      var input = document.querySelector(toggle.getAttribute('data-target'));
      if (!input) return;
      input.setAttribute('type', input.getAttribute('type') === 'password' ? 'text' : 'password');
    });
  });

  (function() {
    var rules = {{rolePermissionRules}};
    var tipo = document.querySelector('#tipo');
    var permissionInputs = document.querySelectorAll('.user-permissions input[type="checkbox"][data-permission]');

    if (!tipo || !permissionInputs.length) return;

    function applyRoleRules() {
      var role = tipo.value;
      var roleRules = rules[role] || { default: [], denied: [] };
      var defaults = roleRules.default || [];
      var denied = roleRules.denied || [];

      permissionInputs.forEach(function(input) {
        var permission = input.getAttribute('data-permission');
        var isDefault = defaults.indexOf(permission) !== -1;
        var isDenied = denied.indexOf(permission) !== -1;

        input.disabled = isDefault || isDenied;

        if (isDefault) {
          input.checked = true;
        }

        if (isDenied) {
          input.checked = false;
        }
      });
    }

    tipo.addEventListener('change', applyRoleRules);
    applyRoleRules();
  })();
</script>
