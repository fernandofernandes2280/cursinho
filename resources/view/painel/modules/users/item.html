<tr>
  <td class="alunos-matricula" data-label="ID">{{id}}</td>
  <td class="student-name-column" data-label="Nome">
    <div class="student-cell">
      <button type="button" class="student-photo-button" data-toggle="modal" data-target="#modalStudentPhoto" data-photo-src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" rel="tooltip" title="Ampliar foto">
        <img src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" class="student-avatar" alt="Foto de {{nome}}">
      </button>
      <a href="{{URL}}/users/{{id}}/edit" class="student-name-link" rel="tooltip" title="Editar usuário">{{nome}}</a>
    </div>
  </td>
  <td data-label="E-mail">{{email}}</td>
  <td class="text-center" data-label="CPF">{{cpf}}</td>
  <td class="text-center" data-label="Tipo">{{tipo}}</td>
  <td data-label="Ações">
    <div class="row-actions">
      <a href="{{URL}}/users/{{id}}/edit" class="table-action" rel="tooltip" title="Editar">
        <i class="material-icons">edit</i>
      </a>
      <button
        type="button"
        class="table-action table-action-danger"
        rel="tooltip"
        title="Excluir"
        data-toggle="modal"
        data-target="#modalDeleteRecord"
        data-delete-url="{{deleteUrl}}"
        data-delete-redirect="{{URL}}/users"
        data-delete-title="Excluir usuário"
        data-delete-warning="Confirme a exclusão deste usuário."
        data-delete-detail-nome="{{nomeAttr}}"
        data-delete-detail-email="{{emailAttr}}"
        data-delete-detail-cpf="{{cpfAttr}}"
        data-delete-detail-tipo="{{tipoAttr}}"
        {{excluirUsuarioVisivel}}
      >
        <i class="material-icons">delete</i>
      </button>
    </div>
  </td>
</tr>
