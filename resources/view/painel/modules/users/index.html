<main class="alunos-page">
  <section class="alunos-panel">
    <div class="alunos-toolbar">
      <div class="alunos-title">
        <h5>Usuários</h5>
      </div>
      <div class="alunos-status">{{statusMessage}}</div>
      <div class="alunos-actions">
        <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Novo" data-toggle="modal" data-target="#modalNovoCpfUser">
          <i class="material-icons">person_add</i>
        </button>
      </div>
    </div>
  </section>

  <section class="alunos-datatable-panel">
    <table
      id="datatablesSimple"
      class="table table-striped alunos-table"
      data-caption="Listagem de usuários cadastrados"
      data-entity-singular="usuário"
      data-entity-plural="usuários"
      data-placeholder="Buscar usuário..."
      data-search-title="Buscar na listagem de usuários"
      data-name-column="1"
      data-actions-column="5"
      data-html-columns="1,5"
    >
      <caption>Listagem de usuários cadastrados</caption>
      <thead>
        <tr>
          <th data-type="string">ID</th>
          <th data-type="html">Nome</th>
          <th data-type="string">E-mail</th>
          <th data-type="string">CPF</th>
          <th data-type="string">Tipo</th>
          <th data-type="html" data-sortable="false" data-searchable="false">Ações</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </section>
</main>
