<form method="post">
	<div class="row">
		<div class="col-5">
			<h5>{{title}}</h5>
		</div>
		<div class="col-4">
			{{statusMessage}}
		</div>

		<div class="col-3 text-right pl-0 form-actions">
			<button class="btn btn-facebook btn-round btn-just-icon" type="submit" rel="tooltip" title="Salvar">
				<i class="material-icons">save</i>
			</button>
			<a href="{{URL}}/disciplinas/new" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Novo">
				<i class="material-icons">add</i>
			</a>
			<a href="{{URL}}/disciplinas" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
				<i class="material-icons">reply</i>
			</a>
		</div>
	</div>

	<div class="aluno-fields-grid">
		<div class="aluno-field aluno-span-12">
			<label for="nome">Nome da disciplina</label>
			<input type="text" id="nome" name="nome" class="form-control-pessoal" value="{{nome}}" required>
		</div>
	</div>
</form>
