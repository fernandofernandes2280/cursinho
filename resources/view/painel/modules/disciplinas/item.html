<tr>
  <td class="alunos-matricula" data-label="ID">{{id}}</td>
  <td class="student-name-column" data-label="Nome">
    <a href="{{URL}}/disciplinas/{{id}}/edit" class="student-name-link" rel="tooltip" title="Editar disciplina">{{nome}}</a>
  </td>
  <td data-label="Ações">
    <div class="row-actions">
      <a href="{{URL}}/disciplinas/{{id}}/edit" class="table-action" rel="tooltip" title="Editar">
        <i class="material-icons">edit</i>
      </a>
      <button
        type="button"
        class="table-action table-action-danger"
        rel="tooltip"
        title="Excluir"
        data-toggle="modal"
        data-target="#modalDeleteRecord"
        data-delete-url="{{deleteUrl}}"
        data-delete-redirect="{{URL}}/disciplinas"
        data-delete-title="Excluir disciplina"
        data-delete-warning="Confirme a exclusão desta disciplina."
        data-delete-detail-nome="{{nomeAttr}}"
        {{excluirDisciplinaVisivel}}
      >
        <i class="material-icons">delete</i>
      </button>
    </div>
  </td>
</tr>
