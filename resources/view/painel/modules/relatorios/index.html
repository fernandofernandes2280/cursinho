<main class="list-page">
  <section class="list-panel">
    <div class="list-toolbar">
      <div class="list-title">
        <h5>{{title}}</h5>
      </div>
    </div>
  </section>

  <section class="list-panel">
    <div class="list-title">
      <h5>Por Procedimento:</h5>
    </div>
    <div class="table-responsive list-table-wrap">
      <table class="table table-striped list-table">
        <thead>
          <tr>
            <th>Descrição</th>
            <th>qtd</th>
          </tr>
        </thead>
        <tbody>
          {{procedimentos}}
          {{procedimentosAvulsos}}
        </tbody>
      </table>
    </div>
  </section>

  {{graficoProcedimentos}}

  <section class="list-panel">
    <div class="list-title">
      <h5>Por Professor:</h5>
    </div>
    <div class="table-responsive list-table-wrap">
      {{professores}}
    </div>
  </section>
</main>
