<main class="list-page">
  <section class="list-panel">
    <div class="list-toolbar">
      <div class="list-title">
        <h5>{{title}}</h5>
      </div>
      <div class="list-status">
        {{statusMessage}}
      </div>
    </div>
  </section>

  <form method="post" class="list-panel">
    <div class="list-filters">
      <div class="list-field">
        <label for="dataInicial">Data Início</label>
        <input class="form-control-pessoal" type="date" id="dataInicial" name="dataInicial" required>
      </div>
      <div class="list-field">
        <label for="dataFinal">Data Fim</label>
        <input class="form-control-pessoal" type="date" id="dataFinal" name="dataFinal" required>
      </div>
      <div class="list-field">
        <button type="submit" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Confirmar">
          <i class="material-icons">check</i>
        </button>
      </div>
    </div>
    <div class="list-status">
      {{mensagem}}
    </div>
  </form>
</main>
