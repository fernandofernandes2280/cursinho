<main class="work-form-page frequencia-individual-page">
  <header class="form-shell-header">
    <div class="form-shell-title">
      <h5>{{title}}</h5>
    </div>
    <a href="{{voltarUrl}}" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
      <i class="material-icons">reply</i>
    </a>
  </header>

  <section class="frequencia-context-card">
    <span>Tipo de frequência</span>
    <strong>Frequência individual</strong>
    <small>{{aula}}</small>
  </section>

  <section class="form-shell-card frequencia-confirm-card">
    <div class="frequencia-confirm-header">
      <div>
        <span>Aluno selecionado</span>
        <h6>Confirmação individual</h6>
      </div>
      <div class="form-status">{{statusMessage}}</div>
    </div>

    <form method="post" action="{{formAction}}" class="frequencia-confirm-form">
      <div class="frequencia-confirm-photo">
        <img src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" alt="Foto de {{nome}}">
      </div>

      <dl class="frequencia-confirm-details">
        <div>
          <dt>Matrícula</dt>
          <dd>{{matricula}}</dd>
        </div>
        <div>
          <dt>Aluno</dt>
          <dd>{{nome}}</dd>
        </div>
        <div>
          <dt>Turma</dt>
          <dd>{{turma}}</dd>
        </div>
        <div>
          <dt>Status</dt>
          <dd><span class="student-status-pill {{statusClasse}}">{{status}}</span></dd>
        </div>
      </dl>

      <div class="frequencia-confirm-actions">
        <button {{escondeBotaoConfirmar}} type="submit" class="btn btn-success" rel="tooltip" title="Confirmar presença">
          <i class="material-icons">check</i>
          <span>Confirmar</span>
        </button>
      </div>
    </form>
  </section>
</main>
