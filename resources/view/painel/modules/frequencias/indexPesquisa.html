<main class="alunos-page">
  <section id="pacientes" class="alunos-panel">
    <div class="alunos-toolbar">
      <div class="alunos-title">
        <h5>{{title}}</h5>
      </div>
      <div class="alunos-status">
        {{statusMessage}}
      </div>
      <div class="alunos-actions">
        <button type="button" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Novo" data-toggle="modal" data-target="#modalNovoCpfAluno">
          <i class="material-icons">person_add</i>
        </button>
        <a href="javascript:history.back()" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
          <i class="material-icons">reply</i>
        </a>
      </div>
    </div>
  </section>

  <section class="alunos-datatable-panel">
    <table
      id="datatablesSimple"
      class="table table-striped alunos-table"
      data-caption="Resultado da pesquisa de alunos para frequência"
      data-entity-singular="aluno"
      data-entity-plural="alunos"
      data-placeholder="Filtrar resultado..."
      data-search-title="Filtrar alunos encontrados"
      data-name-column="1"
      data-status-column="2"
      data-html-columns="1,2"
    >
      <caption>Resultado da pesquisa de alunos para frequência</caption>
      <thead>
        <tr>
          <th data-type="string">Matrícula</th>
          <th data-type="html">Nome</th>
          <th data-type="html">Status</th>
          <th data-type="string">Turma</th>
          <th data-type="string">CPF</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </section>
</main>
