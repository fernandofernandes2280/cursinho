

<div class="row">
	<div class="col-6">
		<h5>{{title}}</h5>
	</div>
	<div class="col-6 text-right form-actions">
		<a href="{{URL}}/aulas" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
			<i class="material-icons">reply</i>
		</a>
	</div>
</div>
<hr>
<form method="post">
	<div class="form-group text-light">
	Você deseja realmente excluir a Aula? As frequências vinculadas a ela também serão removidas.
	
	</div>
	
	<table class="table table-sm ">
		<thead class="text-light titulo-tabela">
			<tr>
				<th>Data</th>
				<th>Turma</th>
				<th>Status</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td class="text-light">{{data}}</td>
				<td class="text-light">{{turma}}</td>
				<td class="text-light"> {{status}}</td>
			</tr>
		</tbody>
	</table>

	<div class="row">
			<div class="col-12 mt-3 text-right form-actions">
		<button type="submit" class="btn btn-danger btn-round btn-just-icon" rel="tooltip" title="Confirmar">
			<i class="material-icons">check</i>
		</button>
	</div>
		
	</div>

</form>
