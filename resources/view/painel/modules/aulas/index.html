<main class="list-page">
  <section class="list-panel">
    <form method="get" id="form">
      <div class="list-toolbar">
        <div class="list-title">
          <h5>{{title}}</h5>
        </div>
        <div class="list-status">
          {{statusMessage}}
        </div>
        <div class="list-actions">
          <button type="submit" class="btn btn-facebook btn-round btn-just-icon" rel="tooltip" title="Pesquisar">
            <i class="material-icons">search</i>
          </button>
          <a href="{{URL}}/aulas/new" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Nova">
            <i class="material-icons">add_circle_outline</i>
          </a>
        </div>
      </div>

      <div class="list-filters">
        <div class="list-field list-field-sm">
          <label for="data">Data da Aula</label>
          <input type="date" max="9999-12-31" class="form-control-pessoal" id="data" name="data" value="{{data}}">
        </div>
        <div class="list-field">
          <label for="turma">Turma</label>
          <select class="custom-select" id="turma" name="turma">
            <option></option>
            {{optionTurma}}
          </select>
        </div>
        <div class="list-field">
          <label for="status">Status</label>
          <select class="custom-select" id="status" name="status">
            <option></option>
            {{optionStatus}}
          </select>
        </div>
      </div>
    </form>
  </section>

  <div class="table-responsive list-table-wrap">
    <table class="table table-hover list-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Professores</th>
          <th>Turma</th>
          <th>Presenças</th>
          <th>Faltas</th>
          <th>Status</th>
          <th>Autor</th>
          <th style="width:13%">Ações</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </div>

  <div class="list-footer">
    <div class="list-pagination">
      {{pagination}}
    </div>
    <span class="list-total">Total: {{totalAtendimentos}}</span>
  </div>
</main>
