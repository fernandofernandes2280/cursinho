<main class="alunos-page">
  <section class="alunos-panel">
    <div class="alunos-toolbar">
      <div class="alunos-title">
        <h5>{{title}}</h5>
      </div>
      <div class="alunos-status">{{statusMessage}}</div>
      <div class="alunos-actions">
        <button type="button" class="btn btn-default btn-round btn-just-icon alunos-columns-toggle" rel="tooltip" title="Ocultar/exibir campos" data-toggle-column-controls="datatablesSimple" aria-expanded="false">
          <i class="material-icons">view_column</i>
        </button>
        <button type="button" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Imprimir" data-table-print>
          <i class="material-icons">print</i>
        </button>
        <a href="{{URL}}/aulas/new" class="btn btn-success btn-round btn-just-icon" rel="tooltip" title="Nova">
          <i class="material-icons">add_circle_outline</i>
        </a>
      </div>
      <div id="aulasColumnControls" class="alunos-column-controls" data-table-column-controls="datatablesSimple" hidden></div>
    </div>
  </section>

  <section class="alunos-datatable-panel">
    <table
      id="datatablesSimple"
      class="table table-hover alunos-table"
      data-caption="Listagem de aulas cadastradas"
      data-entity-singular="aula"
      data-entity-plural="aulas"
      data-placeholder="Buscar aula..."
      data-search-title="Buscar na listagem de aulas"
      data-multi-search="true"
      data-name-column="1"
      data-status-column="5"
      data-actions-column="7"
      data-html-columns="0,1,5,7"
      data-adaptive-pdf="true"
    >
      <caption>Listagem de aulas cadastradas</caption>
      <thead>
        <tr>
          <th data-type="string" data-column-key="data">Data</th>
          <th data-type="html" data-column-key="professores">Professores</th>
          <th data-type="string" data-column-key="turma">Turma</th>
          <th data-type="num" data-column-key="presencas">Presenças</th>
          <th data-type="num" data-column-key="faltas">Faltas</th>
          <th data-type="html" data-column-key="status">Status</th>
          <th data-type="string" data-column-key="autor" data-default-visible="false">Autor</th>
          <th data-type="html" data-sortable="false" data-searchable="false">Ações</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </section>

  <div class="modal fade" id="modalAulaDelete" tabindex="-1" aria-labelledby="modalAulaDeleteLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="aulaDeleteForm" method="post" action="">
          <div class="modal-header">
            <h5 class="modal-title" id="modalAulaDeleteLabel">Excluir aula</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p class="aula-delete-warning">As frequências vinculadas a esta aula também serão removidas.</p>
            <dl class="aula-delete-summary">
              <div>
                <dt>Data</dt>
                <dd id="aulaDeleteData">-</dd>
              </div>
              <div>
                <dt>Turma</dt>
                <dd id="aulaDeleteTurma">-</dd>
              </div>
              <div>
                <dt>Status</dt>
                <dd id="aulaDeleteStatus">-</dd>
              </div>
            </dl>
            <p id="aulaDeleteMessage" class="aula-delete-message" role="status" aria-live="polite"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Cancelar">
              <i class="material-icons">close</i>
            </button>
            <button type="submit" id="aulaDeleteConfirm" class="btn btn-danger btn-round btn-just-icon" rel="tooltip" title="Excluir">
              <i class="material-icons">delete</i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('modalAulaDelete');
    var form = document.getElementById('aulaDeleteForm');
    var confirmButton = document.getElementById('aulaDeleteConfirm');
    var message = document.getElementById('aulaDeleteMessage');
    var dataField = document.getElementById('aulaDeleteData');
    var turmaField = document.getElementById('aulaDeleteTurma');
    var statusField = document.getElementById('aulaDeleteStatus');

    if (!modal || !form || !confirmButton) {
      return;
    }

    function setMessage(text, type) {
      if (!message) {
        return;
      }

      message.textContent = text || '';
      message.className = 'aula-delete-message' + (type ? ' is-' + type : '');
    }

    function setButtonLoading(loading) {
      var icon = confirmButton.querySelector('.material-icons');

      confirmButton.disabled = loading;
      if (icon) {
        icon.textContent = loading ? 'hourglass_empty' : 'delete';
      }
    }

    document.addEventListener('click', function(event) {
      var trigger = event.target.closest('[data-aula-delete-url]');

      if (!trigger) {
        return;
      }

      form.setAttribute('action', trigger.getAttribute('data-aula-delete-url') || '');
      modal.dataset.aulaId = trigger.getAttribute('data-aula-id') || '';
      if (dataField) dataField.textContent = trigger.getAttribute('data-aula-data') || '-';
      if (turmaField) turmaField.textContent = trigger.getAttribute('data-aula-turma') || '-';
      if (statusField) statusField.textContent = trigger.getAttribute('data-aula-status') || '-';
      setButtonLoading(false);
      setMessage('', '');
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      var action = form.getAttribute('action') || '';

      if (!action) {
        setMessage('Não foi possível localizar a aula para exclusão.', 'error');
        return;
      }

      setButtonLoading(true);
      setMessage('Excluindo aula...', 'loading');

      fetch(action, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Accept': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        }
      })
        .then(function(response) {
          return response.json().catch(function() {
            throw new Error('Resposta inválida do servidor.');
          });
        })
        .then(function(data) {
          if (!data || !data.success) {
            throw new Error((data && data.message) || 'Não foi possível excluir a aula.');
          }

          window.location.href = '{{URL}}/aulas?statusMessage=deleted';
        })
        .catch(function(error) {
          setButtonLoading(false);
          setMessage(error.message || 'Não foi possível excluir a aula.', 'error');
        });
    });
  });
</script>
