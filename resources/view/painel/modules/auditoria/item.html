<tr>
  <td data-label="Data/Hora">{{criadoEm}}</td>
  <td data-label="Usuário">
    <strong>{{usuario}}</strong>
    <span class="auditoria-muted">{{tipoUsuario}}</span>
  </td>
  <td data-label="Módulo">{{modulo}}</td>
  <td data-label="Ação">{{acao}}</td>
  <td data-label="Entidade">{{entidade}}</td>
  <td data-label="Descrição">{{descricao}}</td>
  <td class="text-center" data-label="Detalhes">
    <a href="{{URL}}/auditoria/{{id}}" class="table-action" rel="tooltip" title="Ver detalhes">
      <i class="material-icons">visibility</i>
    </a>
  </td>
</tr>
