<div class="auth-page">
  <div class="auth-panel">
    <div class="card card-login mx-auto text-center">
      <div class="card-header card-header-success card-header-icon">
        <div class="card-icon mx-auto">
          <img src="{{URL}}/resources/imagens/logoSiscaps.png" height="45" alt="SISCAPS">
        </div>
      </div>

      <div class="card-body">
        <form action="" method="post" class="auth-form">
          <div class="form-group">
            <label for="email">Digite o email cadastrado:</label>
            <input type="text" name="email" id="email" class="form-control-pessoal" placeholder="E-MAIL" required>
          </div>

          <div class="form-group auth-actions">
            <a href="{{URL}}/login" class="btn btn-warning btn-sm" rel="tooltip" title="Voltar para Home">Voltar</a>
            <input type="submit" value="Enviar" class="btn btn-primary login_btn btn-sm" rel="tooltip" title="Enviar e-mail">
          </div>
        </form>
      </div>
    </div>

    {{status}}
  </div>
</div>
