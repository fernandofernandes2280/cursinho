<aside class="sidebar" data-color="danger" data-background-color="white">
  <div class="logo">
    <div class="sidebar-user-card">
      <a href="{{perfilLink}}" class="sidebar-avatar-link">
        <span class="sidebar-avatar">
          <img src="{{URL}}/app/Controller/File/files/fotos/{{foto}}" alt="foto">
        </span>
      </a>
      <div class="sidebar-user-info">
        <a href="{{perfilLink}}" class="sidebar-user-name-link">
          <span class="sidebar-user-name">{{usuarioLogado}}</span>
        </a>
        <div class="sidebar-user-actions">
          <span class="badge badge-sm bg-gradient-success">{{tipoUsuario}}</span>
          <a href="{{URL}}/logout" class="sidebar-logout" rel="tooltip" title="Sair">
            <i class="material-icons">logout</i>
            <span>Sair</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-wrapper">
    <ul class="nav">
      {{links}}
      {{dropdownProducao}}
      {{dropdownRelatorio}}
      {{dropdownManutencao}}
    </ul>
  </div>
</aside>
