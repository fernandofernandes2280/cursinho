<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="{{URL}}/resources/assets/img/iconPrepara.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>{{title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Icons" />
  <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{URL}}/resources/css/tailwind-dashboard.css?v=103" rel="stylesheet">

  <script src="{{URL}}/resources/assets/js/core/jquery.min.js"></script>
  <script src="{{URL}}/resources/js/qrcode/html5-qrcode.min.js"></script>
</head>

<body class="light-edition" data-report-title="{{reportTitle}}" data-report-logo="{{reportLogo}}">
  <div class="wrapper">
    {{content}}

    <div class="modal fade" id="modalNovoCpfAluno" tabindex="-1" aria-labelledby="modalNovoCpfAlunoLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content modal-content-aluno">
          <form method="get" action="{{URL}}/alunos/new">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNovoCpfAlunoLabel">Informe o CPF do novo Aluno:</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <label for="cpfAluno">CPF:</label>
              <input class="form-control-pessoal mascara-cpf cpfNovo" {{readonly}} required type="text" id="cpfAluno" name="cpfAluno" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Fechar">
                <i class="material-icons">close</i>
              </button>
              <button type="submit" class="btn btn-success btn-round btn-just-icon" id="novoAluno" rel="tooltip" title="Confirmar">
                <i class="material-icons">description</i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalNovoCpfProfessor" tabindex="-1" aria-labelledby="modalNovoCpfProfessorLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content modal-content-professor">
          <form method="get" action="{{URL}}/professores/new">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNovoCpfProfessorLabel">Informe o CPF do novo Professor:</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <label for="cpfProfessor">CPF:</label>
              <input class="form-control-pessoal mascara-cpf cpfNovo" {{readonly}} required type="text" id="cpfProfessor" name="cpfProfessor" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Fechar">
                <i class="material-icons">close</i>
              </button>
              <button type="submit" class="btn btn-success btn-round btn-just-icon" rel="tooltip" id="novoProfessor" title="Confirmar">
                <i class="material-icons">description</i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalNovoCpfUser" tabindex="-1" aria-labelledby="modalNovoCpfUserLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content modal-content-user">
          <form method="get" action="{{URL}}/users/new">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNovoCpfUserLabel">Informe o CPF do novo Usuário:</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <label for="cpfUser">CPF:</label>
              <input class="form-control-pessoal mascara-cpf cpfNovo" {{readonly}} required type="text" id="cpfUser" name="cpfUser" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger btn-round btn-just-icon" data-dismiss="modal" rel="tooltip" title="Fechar">
                <i class="material-icons">close</i>
              </button>
              <button type="submit" class="btn btn-success btn-round btn-just-icon" rel="tooltip" id="novoUser" title="Confirmar">
                <i class="material-icons">description</i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade student-photo-modal" id="modalStudentPhoto" tabindex="-1" aria-labelledby="modalStudentPhotoLabel" aria-hidden="true">
      <div class="modal-dialog student-photo-dialog">
        <div class="modal-content student-photo-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalStudentPhotoLabel">Foto do aluno</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body student-photo-body">
            <img id="studentPhotoPreview" class="student-photo-preview" src="" alt="Foto ampliada do aluno">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{URL}}/resources/js/jquery.mask.js"></script>
  <script src="{{URL}}/resources/js/pages.js?v=59"></script>
  <script src="{{URL}}/resources/js/jquery.plugin.html2canvas.js"></script>
  <script src="{{URL}}/resources/js/html2canvas.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var body = document.body;
      var toggle = document.getElementById('sidebarToggle');
      var compactQuery = window.matchMedia('(max-width: 1023px)');

      function setSidebar(open) {
        if (!compactQuery.matches) {
          body.classList.toggle('sidebar-collapsed', !open);
          body.classList.remove('sidebar-open');
          if (!toggle) return;
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          toggle.setAttribute('title', open ? 'Ocultar painel lateral' : 'Exibir painel lateral');
          var desktopIcon = toggle.querySelector('.material-icons');
          if (desktopIcon) desktopIcon.textContent = open ? 'menu_open' : 'menu';
          return;
        }

        body.classList.remove('sidebar-collapsed');
        body.classList.toggle('sidebar-open', open);
        if (!toggle) return;
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('title', open ? 'Ocultar painel lateral' : 'Exibir painel lateral');
        var icon = toggle.querySelector('.material-icons');
        if (icon) icon.textContent = open ? 'menu_open' : 'menu';
      }

      function isSidebarOpen() {
        if (!compactQuery.matches) {
          return !body.classList.contains('sidebar-collapsed');
        }

        return body.classList.contains('sidebar-open');
      }

      setSidebar(!compactQuery.matches);

      function handleCompactChange() {
        setSidebar(!compactQuery.matches);
      }

      if (compactQuery.addEventListener) {
        compactQuery.addEventListener('change', handleCompactChange);
      } else if (compactQuery.addListener) {
        compactQuery.addListener(handleCompactChange);
      }

      if (toggle) {
        toggle.addEventListener('click', function() {
          setSidebar(!isSidebarOpen());
        });
      }

      function openModal(selector) {
        var modal = document.querySelector(selector);
        if (!modal) return;
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
        var input = modal.querySelector('input, select, textarea, button');
        if (input) setTimeout(function() { input.focus(); }, 50);
      }

      function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      }

      document.addEventListener('click', function(event) {
        var modalTrigger = event.target.closest('[data-toggle="modal"][data-target]');
        if (modalTrigger) {
          event.preventDefault();
          if (modalTrigger.getAttribute('data-target') === '#modalStudentPhoto') {
            var photoPreview = document.getElementById('studentPhotoPreview');
            var photoTitle = document.getElementById('modalStudentPhotoLabel');
            var nameLink = modalTrigger.closest('.student-cell') ? modalTrigger.closest('.student-cell').querySelector('.student-name-link') : null;
            var title = modalTrigger.getAttribute('data-photo-title') || (nameLink ? nameLink.textContent.trim() : 'Foto do aluno');
            if (photoPreview) {
              photoPreview.src = modalTrigger.getAttribute('data-photo-src') || '';
              photoPreview.alt = 'Foto de ' + title;
            }
            if (photoTitle) photoTitle.textContent = title;
          }
          openModal(modalTrigger.getAttribute('data-target'));
          return;
        }

        var dismiss = event.target.closest('[data-dismiss="modal"]');
        if (dismiss) {
          event.preventDefault();
          closeModal(dismiss.closest('.modal'));
          return;
        }

        if (event.target.classList.contains('modal')) {
          closeModal(event.target);
          return;
        }

        var dropdownToggle = event.target.closest('.dropdown-toggle');
        if (dropdownToggle) {
          event.preventDefault();
          var dropdown = dropdownToggle.closest('.dropdown');
          var menu = dropdown ? dropdown.querySelector('.dropdown-menu') : null;
          if (menu) menu.classList.toggle('show');
          if (dropdown) dropdown.classList.toggle('open');
          return;
        }

        document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) {
          if (!menu.closest('.dropdown').contains(event.target)) {
            menu.classList.remove('show');
            menu.closest('.dropdown').classList.remove('open');
          }
        });
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          document.querySelectorAll('.modal.show').forEach(closeModal);
        }
      });

      [['.modal-content-aluno', '#novoAluno'], ['.modal-content-professor', '#novoProfessor'], ['.modal-content-user', '#novoUser']].forEach(function(pair) {
        var content = document.querySelector(pair[0]);
        var button = document.querySelector(pair[1]);
        if (!content || !button) return;
        content.addEventListener('keypress', function(event) {
          if (event.which === 13 || event.key === 'Enter') {
            event.preventDefault();
            button.click();
          }
        });
      });

      function normalizePdfValue(value) {
        return (value || '').replace(/\s+/g, ' ').trim();
      }

      function getStudentReportTitleLines(value, fallback) {
        var lines = normalizePdfValue(value)
          .split('*')
          .map(function(line) {
            return normalizePdfValue(line);
          })
          .filter(Boolean);

        return lines.length ? lines : [normalizePdfValue(fallback || 'Relatório')];
      }

      function getStudentReportLogoSrc() {
        return normalizePdfValue(document.body.getAttribute('data-report-logo'));
      }

      function loadStudentPdfImageDataUrl(src) {
        return new Promise(function(resolve) {
          if (!src) {
            resolve(null);
            return;
          }

          var image = new Image();
          image.crossOrigin = 'anonymous';

          image.onload = function() {
            try {
              var canvas = document.createElement('canvas');
              var width = image.naturalWidth || image.width;
              var height = image.naturalHeight || image.height;

              if (!width || !height) {
                resolve(null);
                return;
              }

              canvas.width = width;
              canvas.height = height;
              canvas.getContext('2d').drawImage(image, 0, 0);

              resolve({
                dataUrl: canvas.toDataURL('image/png'),
                width: width,
                height: height,
                format: 'PNG'
              });
            } catch (error) {
              resolve(null);
            }
          };

          image.onerror = function() {
            resolve(null);
          };

          image.src = src;
        });
      }

      function addStudentPdfPageNumbers(doc) {
        var pageCount = doc.internal.getNumberOfPages();

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(87, 96, 106);

        for (var page = 1; page <= pageCount; page++) {
          doc.setPage(page);
          doc.text(
            'Página ' + page + ' de ' + pageCount,
            doc.internal.pageSize.getWidth() - 36,
            doc.internal.pageSize.getHeight() - 18,
            {
              align: 'right'
            }
          );
        }

        doc.setTextColor(36, 41, 47);
      }

      async function drawStudentPdfHeader(doc, reportTitle) {
        var pageWidth = doc.internal.pageSize.getWidth();
        var headerY = 32;
        var logo = await loadStudentPdfImageDataUrl(getStudentReportLogoSrc());
        var titleLines = getStudentReportTitleLines(document.body.getAttribute('data-report-title'), reportTitle);

        if (logo) {
          var logoScale = Math.min(48 / logo.width, 42 / logo.height, 1);
          var logoWidth = logo.width * logoScale;
          var logoHeight = logo.height * logoScale;
          var logoX = (pageWidth - logoWidth) / 2;

          doc.addImage(logo.dataUrl, logo.format, logoX, headerY, logoWidth, logoHeight);
          headerY += logoHeight + 8;
        }

        titleLines.forEach(function(line) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.splitTextToSize(line.toLocaleUpperCase('pt-BR'), pageWidth - 72).forEach(function(wrappedLine) {
            doc.text(wrappedLine, pageWidth / 2, headerY, {
              align: 'center'
            });
            headerY += 10;
          });
        });

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12);
        headerY += 15;
        doc.splitTextToSize(reportTitle, pageWidth - 72).forEach(function(line) {
          doc.text(line, pageWidth / 2, headerY, {
            align: 'center'
          });
          headerY += 13;
        });

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(87, 96, 106);
        doc.text('Gerado em: ' + new Date().toLocaleString('pt-BR'), 36, headerY + 3);
        doc.setTextColor(36, 41, 47);

        return headerY + 18;
      }

      function formatStudentDate(value) {
        value = normalizePdfValue(value);

        if (/^\d{4}-\d{2}-\d{2}/.test(value)) {
          var parts = value.substring(0, 10).split('-');
          return parts[2] + '/' + parts[1] + '/' + parts[0];
        }

        return value;
      }

      function getStudentControlValue(form, name) {
        var field = form.querySelector('[name="' + name + '"]');

        if (!field) {
          return '';
        }

        if (field.tagName === 'SELECT') {
          var option = field.options[field.selectedIndex];
          return normalizePdfValue(option ? option.textContent : '');
        }

        return normalizePdfValue(field.value);
      }

      function getStudentField(label, value) {
        return {
          label: label,
          value: normalizePdfValue(value) || '-'
        };
      }

      function getStudentFormData(form) {
        var matricula = form.querySelector('.aluno-matricula-value');
        var photo = form.querySelector('.aluno-photo-box img');

        return {
          photo: photo ? photo.src : '',
          matricula: normalizePdfValue(matricula ? matricula.textContent : ''),
          nome: getStudentControlValue(form, 'nome'),
          cep: getStudentControlValue(form, 'cep'),
          endereco: getStudentControlValue(form, 'endereco'),
          numero: getStudentControlValue(form, 'numero'),
          bairro: getStudentControlValue(form, 'bairro'),
          cidade: getStudentControlValue(form, 'cidade'),
          uf: getStudentControlValue(form, 'uf'),
          naturalidade: getStudentControlValue(form, 'naturalidade'),
          escolaridade: getStudentControlValue(form, 'escolaridade'),
          estadoCivil: getStudentControlValue(form, 'estadoCivil'),
          sexo: getStudentControlValue(form, 'sexo'),
          dataNasc: formatStudentDate(getStudentControlValue(form, 'dataNasc')),
          dataCad: formatStudentDate(getStudentControlValue(form, 'dataCad')),
          fone: getStudentControlValue(form, 'fone'),
          cpf: getStudentControlValue(form, 'cpf'),
          turma: getStudentControlValue(form, 'turma'),
          mae: getStudentControlValue(form, 'mae'),
          status: getStudentControlValue(form, 'status'),
          obs: getStudentControlValue(form, 'obs')
        };
      }

      function getProfessorFormData(form) {
        var photo = form.querySelector('.professor-photo-box img');

        return {
          photo: photo ? photo.src : '',
          nome: getStudentControlValue(form, 'nome'),
          cpf: getStudentControlValue(form, 'cpf'),
          status: getStudentControlValue(form, 'status'),
          funcao: getStudentControlValue(form, 'funcao'),
          dataNasc: formatStudentDate(getStudentControlValue(form, 'dataNasc')),
          fone: getStudentControlValue(form, 'fone'),
          email: getStudentControlValue(form, 'email'),
          cep: getStudentControlValue(form, 'cep'),
          endereco: getStudentControlValue(form, 'endereco'),
          bairro: getStudentControlValue(form, 'bairro'),
          cidade: getStudentControlValue(form, 'cidade'),
          uf: getStudentControlValue(form, 'uf')
        };
      }

      function buildStudentPdfRow(left, right) {
        var labelStyle = {
          fillColor: [248, 250, 252],
          textColor: [71, 85, 105],
          fontStyle: 'bold'
        };

        return [
          { content: left.label, styles: labelStyle },
          { content: left.value },
          { content: right ? right.label : '', styles: labelStyle },
          { content: right ? right.value : '' }
        ];
      }

      function addStudentPdfSection(doc, title, rows, startY, options) {
        var pageWidth = doc.internal.pageSize.getWidth();
        var marginLeft = options && options.marginLeft ? options.marginLeft : 36;
        var tableWidth = options && options.tableWidth ? options.tableWidth : pageWidth - marginLeft - 36;
        var hasTitle = normalizePdfValue(title) !== '';
        var tableStartY = hasTitle ? startY + 7 : startY;

        if (hasTitle) {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9);
          doc.setTextColor(36, 41, 47);
          doc.text(title, marginLeft, startY);
        }

        doc.autoTable({
          body: rows.map(function(row) {
            return buildStudentPdfRow(row[0], row[1]);
          }),
          startY: tableStartY,
          tableWidth: tableWidth,
          margin: {
            left: marginLeft,
            right: 36
          },
          styles: {
            font: 'helvetica',
            fontSize: 8,
            cellPadding: 4,
            overflow: 'linebreak',
            textColor: [36, 41, 47],
            lineColor: [208, 215, 222],
            lineWidth: .35
          },
          columnStyles: {
            0: { cellWidth: 64 },
            1: { cellWidth: (tableWidth - 128) / 2 },
            2: { cellWidth: 64 },
            3: { cellWidth: (tableWidth - 128) / 2 }
          },
          alternateRowStyles: {
            fillColor: [252, 253, 255]
          }
        });

        return (doc.lastAutoTable ? doc.lastAutoTable.finalY : startY + 24) + 12;
      }

      function addStudentObservationSection(doc, value, startY) {
        doc.autoTable({
          body: [[
            {
              content: 'Observações',
              styles: {
                fillColor: [248, 250, 252],
                textColor: [71, 85, 105],
                fontStyle: 'bold'
              }
            },
            normalizePdfValue(value) || '-'
          ]],
          startY: startY,
          margin: {
            left: 36,
            right: 36
          },
          columnStyles: {
            0: { cellWidth: 64 }
          },
          styles: {
            font: 'helvetica',
            fontSize: 8,
            cellPadding: 5,
            overflow: 'linebreak',
            textColor: [36, 41, 47],
            lineColor: [208, 215, 222],
            lineWidth: .35
          }
        });

        return (doc.lastAutoTable ? doc.lastAutoTable.finalY : startY + 24) + 12;
      }

      async function generateStudentFormPdf(form) {
        var jsPDFConstructor = window.jspdf && window.jspdf.jsPDF;

        if (!jsPDFConstructor || !window.jspdf || typeof jsPDFConstructor !== 'function') {
          alert('Não foi possível gerar o PDF. A biblioteca jsPDF não foi carregada.');
          return;
        }

        var doc = new jsPDFConstructor({
          orientation: 'portrait',
          unit: 'pt',
          format: 'a4'
        });

        if (typeof doc.autoTable !== 'function') {
          alert('Não foi possível gerar o PDF. O plugin de tabelas do jsPDF não foi carregado.');
          return;
        }

        var data = getStudentFormData(form);
        var pageWidth = doc.internal.pageSize.getWidth();
        var y = await drawStudentPdfHeader(doc, 'Dados cadastrais do aluno');
        var photo = await loadStudentPdfImageDataUrl(data.photo);
        var photoX = 36;
        var photoY = y;
        var photoWidth = 94;
        var photoHeight = 110;
        var infoX = photoX + photoWidth + 16;
        var infoWidth = pageWidth - infoX - 36;

        doc.setDrawColor(208, 215, 222);
        doc.setFillColor(248, 250, 252);
        doc.roundedRect(photoX, photoY, photoWidth, photoHeight, 4, 4, 'FD');

        if (photo) {
          var scale = Math.min((photoWidth - 10) / photo.width, (photoHeight - 10) / photo.height);
          var imageWidth = photo.width * scale;
          var imageHeight = photo.height * scale;
          doc.addImage(
            photo.dataUrl,
            photo.format,
            photoX + (photoWidth - imageWidth) / 2,
            photoY + (photoHeight - imageHeight) / 2,
            imageWidth,
            imageHeight
          );
        }

        var afterIdentificacao = addStudentPdfSection(doc, '', [
          [getStudentField('Matrícula', data.matricula), getStudentField('Status', data.status)],
          [getStudentField('Nome', data.nome), getStudentField('CPF', data.cpf)],
          [getStudentField('Turma', data.turma), getStudentField('Telefone', data.fone)]
        ], y, {
          marginLeft: infoX,
          tableWidth: infoWidth
        });

        var afterEndereco = addStudentPdfSection(doc, '', [
          [getStudentField('Endereço', data.endereco), getStudentField('CEP', data.cep)],
          [getStudentField('Nº', data.numero), getStudentField('Bairro', data.bairro)],
          [getStudentField('Cidade', data.cidade), getStudentField('UF', data.uf)]
        ], afterIdentificacao - 2, {
          marginLeft: infoX,
          tableWidth: infoWidth
        });

        y = Math.max(photoY + photoHeight + 12, afterEndereco);

        y = addStudentPdfSection(doc, '', [
          [getStudentField('Nascimento', data.dataNasc), getStudentField('Cadastro', data.dataCad)],
          [getStudentField('Naturalidade', data.naturalidade), getStudentField('Sexo', data.sexo)],
          [getStudentField('Escolaridade', data.escolaridade), getStudentField('Estado civil', data.estadoCivil)],
          [getStudentField('Mãe', data.mae), getStudentField('Telefone', data.fone)]
        ], y);

        addStudentObservationSection(doc, data.obs, y);
        addStudentPdfPageNumbers(doc);

        var pdfUrl = doc.output('bloburl');
        var reportWindow = window.open(pdfUrl, '_blank');

        if (!reportWindow) {
          window.location.href = pdfUrl;
        }
      }

      async function generateProfessorFormPdf(form) {
        var jsPDFConstructor = window.jspdf && window.jspdf.jsPDF;

        if (!jsPDFConstructor || !window.jspdf || typeof jsPDFConstructor !== 'function') {
          alert('Não foi possível gerar o PDF. A biblioteca jsPDF não foi carregada.');
          return;
        }

        var doc = new jsPDFConstructor({
          orientation: 'portrait',
          unit: 'pt',
          format: 'a4'
        });

        if (typeof doc.autoTable !== 'function') {
          alert('Não foi possível gerar o PDF. O plugin de tabelas do jsPDF não foi carregado.');
          return;
        }

        var data = getProfessorFormData(form);
        var pageWidth = doc.internal.pageSize.getWidth();
        var y = await drawStudentPdfHeader(doc, 'Dados cadastrais do professor');
        var photo = await loadStudentPdfImageDataUrl(data.photo);
        var photoX = 36;
        var photoY = y;
        var photoWidth = 94;
        var photoHeight = 110;

	          if (desiredTotal > availableWidth) {
	            var shrinkable = widths.reduce(function(total, column) {
	              return total + Math.max(0, column.width - column.min);
	            }, 0);
	            var overflow = desiredTotal - availableWidth;

	            widths = widths.map(function(column) {
	              if (minimumTotal > availableWidth) {
	                return column.min * (availableWidth / minimumTotal);
	              }

	              if (!shrinkable) {
	                return column.min;
	              }

	              return Math.max(column.min, column.width - (Math.max(0, column.width - column.min) / shrinkable * overflow));
	            });
	          } else {
	            widths = widths.map(function(column) {
	              return column.width;
	            });
	          }

	          return {
	            minimumTotal: minimumTotal,
	            total: widths.reduce(function(total, width) {
	              return total + width;
	            }, 0),
	            columnStyles: widths.reduce(function(styles, width, index) {
	              styles[index] = {
	                cellWidth: Math.floor(width * 10) / 10
	              };
	              return styles;
	            }, {})
	          };
	        }

	        function openPrintableReport(headers, rows, searchValue) {
          var reportWindow = window.open('', '_blank');

          if (!reportWindow) {
            alert('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups.');
            return;
          }

	          var generatedAt = new Date().toLocaleString('pt-BR');
	          var reportTitleLines = getReportTitleLines(document.body.getAttribute('data-report-title'), caption);
	          var reportLogo = getReportLogoSrc();
	          var filterSummary = getReportFilterSummary(searchValue);
	          var reportSummary = normalizeReportText(datatablesSimple.getAttribute('data-report-summary') || '');
	          var bodyRows = rows.length ? rows : [headers.map(function(_, index) {
	            return index === 0 ? 'Nenhum registro encontrado.' : '';
	          })];
	          var summaryHtml = reportSummary ? 'Resumo: ' + escapeHtml(reportSummary) + '<br>' : '';

	          reportWindow.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>' + escapeHtml(pdfCaption) + '</title>');
	          reportWindow.document.write('<style>body{font-family:Arial,sans-serif;margin:24px;color:#24292f}.report-heading{text-align:center;margin-bottom:14px;text-transform:uppercase}.report-logo{display:block;max-width:54px;max-height:46px;object-fit:contain;margin:0 auto 5px}.report-title-main,.report-title-sub{font-size:10px;font-weight:400;line-height:1.16;margin:0}.report-title-sub{margin-top:1px}h2{font-size:12px;font-weight:700;margin:18px 0 0;color:#24292f;text-align:center}.meta{font-size:12px;color:#57606a;margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #d0d7de;padding:6px;text-align:left;vertical-align:top}th{background:#f6f8fa}@media print{body{margin:12mm}}</style>');
	          reportWindow.document.write('</head><body><div class="report-heading">');
	          if (reportLogo) {
	            reportWindow.document.write('<img class="report-logo" src="' + escapeHtml(reportLogo) + '" alt="Logotipo do relatório">');
	          }
	          reportTitleLines.forEach(function(line, index) {
	            reportWindow.document.write('<div class="' + (index === 0 ? 'report-title-main' : 'report-title-sub') + '">' + escapeHtml(line) + '</div>');
	          });
	          reportWindow.document.write('<h2>' + escapeHtml(pdfCaption) + '</h2></div><div class="meta">Filtros aplicados: ' + escapeHtml(filterSummary) + '<br>' + summaryHtml + 'Gerado em: ' + escapeHtml(generatedAt) + '<br>Registros: ' + rows.length + '</div><table><thead><tr>');
          headers.forEach(function(header) {
            reportWindow.document.write('<th>' + escapeHtml(header) + '</th>');
          });
          reportWindow.document.write('</tr></thead><tbody>');
          bodyRows.forEach(function(row) {
            reportWindow.document.write('<tr>');
            row.forEach(function(cell) {
              reportWindow.document.write('<td>' + escapeHtml(cell) + '</td>');
            });
            reportWindow.document.write('</tr>');
          });
          reportWindow.document.write('</tbody></table></body></html>');
          reportWindow.document.close();
          reportWindow.focus();
          setTimeout(function() {
            reportWindow.print();
          }, 250);
        }

	        async function generateTablePdf() {
	          var printableColumns = getPrintableColumns();
	          var headers = printableColumns.map(function(column) {
	            return column.label;
	          });
          var rows = getFilteredReportRows();
          var searchValue = getReportSearchValue();
	          var jsPDFConstructor = window.jspdf && window.jspdf.jsPDF;
	          var generatedAt = new Date().toLocaleString('pt-BR');
	          var reportTitleLines = getReportTitleLines(document.body.getAttribute('data-report-title'), caption);
	          var filterSummary = getReportFilterSummary(searchValue);
	          var reportSummary = normalizeReportText(datatablesSimple.getAttribute('data-report-summary') || '');
	          var hasAdaptivePdf = datatablesSimple.getAttribute('data-adaptive-pdf') === 'true';

          if (!headers.length) {
            alert('Não há colunas disponíveis para imprimir.');
            return;
          }

          if (!jsPDFConstructor) {
            openPrintableReport(headers, rows, searchValue);
            return;
          }

	          var pdfOrientation = headers.length > 5 ? 'landscape' : 'portrait';

	          if (hasAdaptivePdf) {
	            var portraitAvailableWidth = 595.28 - 72;
	            var portraitLayout = getAdaptivePdfColumnLayout(printableColumns, headers, rows, portraitAvailableWidth);
	            pdfOrientation = portraitLayout.minimumTotal <= portraitAvailableWidth ? 'portrait' : 'landscape';
	          }

          var doc = new jsPDFConstructor({
            orientation: pdfOrientation,
            unit: 'pt',
            format: 'a4'
          });

          if (typeof doc.autoTable !== 'function') {
            openPrintableReport(headers, rows, searchValue);
            return;
          }

	          var pageWidth = doc.internal.pageSize.getWidth();
	          var tableAvailableWidth = pageWidth - 72;
	          var adaptiveTableLayout = hasAdaptivePdf ? getAdaptivePdfColumnLayout(printableColumns, headers, rows, tableAvailableWidth) : null;
	          var headerY = 32;
	          var logo = await loadReportLogoDataUrl(getReportLogoSrc());

	          if (logo) {
	            var logoScale = Math.min(48 / logo.width, 42 / logo.height, 1);
	            var logoWidth = logo.width * logoScale;
	            var logoHeight = logo.height * logoScale;
	            var logoX = (pageWidth - logoWidth) / 2;

	            doc.addImage(logo.dataUrl, logo.format, logoX, headerY, logoWidth, logoHeight);
	            headerY += logoHeight + 8;
	          }

	          reportTitleLines.forEach(function(line, index) {
	            doc.setFont('helvetica', 'normal');
	            doc.setFontSize(9);

	            doc.splitTextToSize(line.toLocaleUpperCase('pt-BR'), pageWidth - 72).forEach(function(wrappedLine) {
	              doc.text(wrappedLine, pageWidth / 2, headerY, {
	                align: 'center'
	              });
		              headerY += 10;
	            });
	          });

	          doc.setFont('helvetica', 'bold');
	          doc.setFontSize(12);
	          headerY += 15;
	          doc.splitTextToSize(pdfCaption, pageWidth - 72).forEach(function(line) {
	            doc.text(line, pageWidth / 2, headerY, {
	              align: 'center'
	            });
	            headerY += 13;
	          });
	          doc.setFont('helvetica', 'normal');
	          doc.setFontSize(9);
	          headerY += 1;
	          doc.splitTextToSize('Filtros aplicados: ' + filterSummary, pageWidth - 72).forEach(function(line) {
	            doc.text(line, 36, headerY);
	            headerY += 12;
	          });
	          if (reportSummary) {
	            doc.splitTextToSize('Resumo: ' + reportSummary, pageWidth - 72).forEach(function(line) {
	              doc.text(line, 36, headerY);
	              headerY += 12;
	            });
	          }
	          doc.text('Gerado em: ' + generatedAt, 36, headerY);
	          headerY += 14;
	          doc.text('Registros: ' + rows.length, 36, headerY);

	          var startY = headerY + 16;

          doc.autoTable({
            head: [headers],
            body: rows.length ? rows : [headers.map(function(_, index) {
              return index === 0 ? 'Nenhum registro encontrado.' : '';
            })],
            startY: startY,
            margin: {
              left: 36,
              right: 36
            },
	            tableWidth: adaptiveTableLayout ? adaptiveTableLayout.total : 'auto',
	            columnStyles: adaptiveTableLayout ? adaptiveTableLayout.columnStyles : {},
            styles: {
              font: 'helvetica',
	              fontSize: adaptiveTableLayout ? 7.2 : 8,
	              cellPadding: adaptiveTableLayout ? 3 : 4,
              overflow: 'linebreak',
              textColor: [36, 41, 47],
              lineColor: [208, 215, 222],
              lineWidth: .4
            },
            headStyles: {
              fillColor: [246, 248, 250],
              textColor: [36, 41, 47],
              fontStyle: 'bold'
            },
	            alternateRowStyles: {
	              fillColor: [248, 250, 252]
	            }
	          });

	          addPdfPageNumbers(doc);

	          var pdfUrl = doc.output('bloburl');
          var reportWindow = window.open(pdfUrl, '_blank');

          if (!reportWindow) {
            window.location.href = pdfUrl;
          }
        }

        document.querySelectorAll('[data-table-print]').forEach(function(button) {
          button.addEventListener('click', function(event) {
            event.preventDefault();
            generateTablePdf();
          });
        });

        var walletPdfFrame = null;
        var walletPdfJobId = '';
        var walletPdfButton = null;
        var walletProgress = document.querySelector('[data-table-wallet-progress]');
        var walletProgressMessage = document.querySelector('[data-table-wallet-progress-message]');
        var walletProgressCount = document.querySelector('[data-table-wallet-progress-count]');
        var walletProgressBar = document.querySelector('[data-table-wallet-progress-bar]');

        function setWalletPdfProgress(message, percent, count) {
          if (!walletProgress) {
            return;
          }

          walletProgress.hidden = false;

          if (walletProgressMessage) {
            walletProgressMessage.textContent = message;
          }

          if (walletProgressCount && count !== undefined) {
            walletProgressCount.textContent = count;
          }

          if (walletProgressBar) {
            walletProgressBar.style.width = Math.max(0, Math.min(100, percent || 0)) + '%';
          }
        }

        function resetWalletPdfJob() {
          if (walletPdfFrame && walletPdfFrame.parentNode) {
            walletPdfFrame.parentNode.removeChild(walletPdfFrame);
          }

          walletPdfFrame = null;

          if (walletPdfButton) {
            walletPdfButton.removeAttribute('aria-busy');
            walletPdfButton.classList.remove('is-loading');
          }

          walletPdfButton = null;
        }

        window.addEventListener('message', function(event) {
          if (event.origin !== window.location.origin) {
            return;
          }

          var data = event.data || {};

          if (!data.type || data.jobId !== walletPdfJobId) {
            return;
          }

          if (data.type === 'wallet-pdf-progress') {
            setWalletPdfProgress(data.message || 'Gerando carteiras...', data.percent || 0, data.count || '');
            return;
          }

          if (data.type === 'wallet-pdf-error') {
            setWalletPdfProgress(data.message || 'Não foi possível gerar o PDF das carteiras.', 0, '');
            resetWalletPdfJob();
            return;
          }

          if (data.type === 'wallet-pdf-complete') {
            setWalletPdfProgress(data.message || 'PDF gerado. Abrindo arquivo...', 100, data.count || '');

            if (data.blob) {
              var pdfUrl = URL.createObjectURL(data.blob);
              var pdfWindow = window.open(pdfUrl, '_blank');

              if (!pdfWindow) {
                window.location.href = pdfUrl;
              }

              setTimeout(function() {
                URL.revokeObjectURL(pdfUrl);
              }, 60000);
            }

            resetWalletPdfJob();
          }
        });

        document.querySelectorAll('[data-table-wallet-print]').forEach(function(button) {
          button.addEventListener('click', function(event) {
            event.preventDefault();

            if (button.getAttribute('aria-busy') === 'true') {
              return;
            }

            var ids = getFilteredReportRowObjects().map(function(row) {
              return row.id;
            }).filter(Boolean);

            if (!ids.length) {
              alert('Nenhum aluno encontrado nos filtros atuais.');
              return;
            }

            resetWalletPdfJob();
            walletPdfButton = button;
            walletPdfJobId = String(Date.now()) + String(Math.floor(Math.random() * 100000));
            button.setAttribute('aria-busy', 'true');
            button.classList.add('is-loading');
            setWalletPdfProgress('Preparando ' + ids.length + ' carteiras...', 3, ids.length + ' alunos');

            var separator = button.href.indexOf('?') === -1 ? '?' : '&';
            var url = button.href + separator + 'ids=' + encodeURIComponent(ids.join(',')) + '&embedded=1&job=' + encodeURIComponent(walletPdfJobId);
            walletPdfFrame = document.createElement('iframe');
            walletPdfFrame.src = url;
            walletPdfFrame.setAttribute('aria-hidden', 'true');
            walletPdfFrame.style.position = 'absolute';
            walletPdfFrame.style.left = '-2200px';
            walletPdfFrame.style.top = '0';
            walletPdfFrame.style.width = '1200px';
            walletPdfFrame.style.height = '800px';
            walletPdfFrame.style.opacity = '0';
            walletPdfFrame.style.pointerEvents = 'none';
            walletPdfFrame.style.border = '0';
            document.body.appendChild(walletPdfFrame);
          });
        });

        var dataTable = new simpleDatatables.DataTable(datatablesSimple, {
          caption: caption,
          perPage: 10,
          perPageSelect: [10, 25, 50, ['Todos', 0]],
          searchable: true,
          fixedHeight: false,
          firstLast: true,
          firstText: 'Primeira',
          lastText: 'Última',
          nextText: 'Próxima',
          prevText: 'Anterior',
          columns: configuredColumns,
          labels: {
            placeholder: placeholder,
            searchTitle: searchTitle,
            pageTitle: 'Página {page}',
            perPage: 'registros por página',
            noRows: 'Nenhum ' + singular + ' encontrado',
            noResults: 'Nenhum resultado corresponde à sua busca',
            info: 'Mostrando {start} a {end} de {rows} ' + plural
          }
        });

        createTableSearchControls(dataTable);
      }
    });
  </script>
