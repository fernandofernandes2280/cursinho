<main class="list-page">
  <section id="pesquisa" class="list-panel">
    <form method="get" id="form">
      <div class="list-toolbar">
        <div class="list-title">
          <h5>{{title}}</h5>
        </div>
        <div class="list-actions">
          <button type="submit" class="btn btn-facebook btn-round btn-just-icon" rel="tooltip" title="Pesquisar">
            <i class="material-icons">search</i>
          </button>
          <a href="{{URL}}/aulas" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
            <i class="material-icons">reply</i>
          </a>
        </div>
      </div>

      <div class="list-filters">
        <div class="list-field list-field-sm">
          <label for="matricula">Matrícula</label>
          <input type="text" name="matricula" id="matricula" class="form-control-pessoal matricula" value="{{matricula}}">
        </div>
        <div class="list-field list-field-lg">
          <label for="nome">Nome</label>
          <input type="text" name="nome" id="nome" class="form-control-pessoal" value="{{nome}}">
        </div>
        <div class="list-field list-field-sm">
          <label for="cpfPesq">CPF</label>
          <input type="text" name="cpfPesq" id="cpfPesq" class="form-control-pessoal mascara-cpf cpfPesquisa" value="{{cpf}}">
        </div>
        <div class="list-field list-field-sm">
          <label for="turma">Turma</label>
          <select class="custom-select" id="turma" name="turma">
            <option value="">Todas</option>
            {{optionTurma}}
          </select>
        </div>
      </div>
    </form>
  </section>

  <section class="list-panel">
    <div class="list-title">
      <h5>{{subtitle}}</h5>
    </div>
  </section>

  <div class="table-responsive list-table-wrap">
    <table class="table table-hover list-table">
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Turma</th>
          <th>Status</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </div>

  <div class="list-footer">
    <div class="list-pagination">
      {{pagination}}
    </div>
    <span class="list-total">Total: {{total}}</span>
  </div>
</main>
