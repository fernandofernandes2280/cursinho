<main class="alunos-page">
  <section class="alunos-panel">
    <div class="alunos-toolbar">
      <div class="alunos-title">
        <h5>{{subtitle}}</h5>
        <p class="mt-1 text-sm font-bold text-slate-500">{{title}}</p>
      </div>
      <div class="alunos-actions">
        <button type="button" class="btn btn-default btn-round btn-just-icon alunos-columns-toggle" rel="tooltip" title="Ocultar/exibir campos" data-toggle-column-controls="datatablesSimple" aria-expanded="false">
          <i class="material-icons">view_column</i>
        </button>
        <button type="button" class="btn btn-default btn-round btn-just-icon" rel="tooltip" title="Imprimir" data-table-print>
          <i class="material-icons">print</i>
        </button>
        <a href="{{voltarUrl}}" class="btn btn-warning btn-round btn-just-icon" rel="tooltip" title="Voltar">
          <i class="material-icons">reply</i>
        </a>
      </div>
      <div id="frequenciaAulaColumnControls" class="alunos-column-controls" data-table-column-controls="datatablesSimple" hidden></div>
    </div>
  </section>

  <section class="alunos-datatable-panel">
    <table
      id="datatablesSimple"
      class="table table-striped alunos-table"
      data-caption="Listagem de frequência da aula"
      data-pdf-title="{{subtitle}} - {{title}}"
      data-entity-singular="aluno"
      data-entity-plural="alunos"
      data-placeholder="Buscar aluno..."
      data-search-title="Buscar na listagem de frequência"
      data-multi-search="true"
      data-name-column="1"
      data-status-column="7"
      data-html-columns="1,2,3,7"
      data-adaptive-pdf="true"
    >
      <caption>Listagem de frequência da aula</caption>
      <thead>
        <tr>
          <th data-type="string" data-column-key="matricula">Matrícula</th>
          <th data-type="html" data-column-key="aluno">Aluno</th>
          <th data-type="html" data-column-key="fotoAuditoria" data-sortable="false" data-searchable="false">Foto captura</th>
          <th data-type="html" data-column-key="comparacaoFacial">Reconhecimento</th>
          <th data-type="string" data-column-key="turma">Turma</th>
          <th data-type="string" data-column-key="fone" data-default-visible="false">Telefone</th>
          <th data-type="string" data-column-key="endereco" data-default-visible="false">Endereço</th>
          <th data-type="html" data-column-key="status">Status</th>
          <th data-type="string" data-column-key="hora">Hora</th>
        </tr>
      </thead>
      <tbody>
        {{itens}}
      </tbody>
    </table>
  </section>
</main>
