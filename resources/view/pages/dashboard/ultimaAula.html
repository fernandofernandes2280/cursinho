<tr>
  <td>
    <strong>{{data}}</strong>
    <span>{{diaSemana}}</span>
  </td>
  <td>{{turma}}</td>
  <td>
    <div class="dashboard-lesson-stack">
      <span>{{professorDisciplina}}</span>
      {{complemento}}
    </div>
  </td>
  <td class="dashboard-report-number">{{presencas}}</td>
  <td class="dashboard-report-number">{{faltas}}</td>
  <td>
    <span class="dashboard-lesson-status {{statusClasse}}">{{status}}</span>
  </td>
  <td>
    <a href="{{URL}}/aulas/{{id}}/presentes" class="dashboard-report-link">Frequência</a>
  </td>
</tr>
