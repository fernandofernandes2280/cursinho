<section class="dashboard-grid">
  <article class="dashboard-stat-card dashboard-stat-warning">
    <div class="dashboard-stat-icon">
      <i class="material-icons">family_restroom</i>
    </div>
    <div class="dashboard-stat-content">
      <h3>Alunos</h3>
      <div class="table-responsive">
        <table class="table dashboard-stat-table">
          <thead>
            <tr>
              <th>Ativos</th>
              <th>Inativos</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{totalAtivos}}</td>
              <td>{{totalInativos}}</td>
              <td>{{totalAlunos}}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>

  <article class="dashboard-stat-card dashboard-stat-success">
    <div class="dashboard-stat-icon">
      <i class="material-icons">sunny</i>
    </div>
    <div class="dashboard-stat-content">
      <h3>Manhã</h3>
      <div class="table-responsive">
        <table class="table dashboard-stat-table">
          <thead>
            <tr>
              <th>Ativos</th>
              <th>Inativos</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{totalManhaAtivos}}</td>
              <td>{{totalManhaInativos}}</td>
              <td>{{totalManha}}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>

  <article class="dashboard-stat-card dashboard-stat-danger">
    <div class="dashboard-stat-icon">
      <i class="material-icons">dark_mode</i>
    </div>
    <div class="dashboard-stat-content">
      <h3>Noite</h3>
      <div class="table-responsive">
        <table class="table dashboard-stat-table">
          <thead>
            <tr>
              <th>Ativos</th>
              <th>Inativos</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{totalNoiteAtivos}}</td>
              <td>{{totalNoiteInativos}}</td>
              <td>{{totalNoite}}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>
</section>
