<main class="qr-page" data-qr-reader data-qr-id-aula="{{idAula}}" data-qr-aula-generica="{{aulaGenerica}}" data-qr-base-url="{{URL}}" data-qr-fps="20" data-qr-qrbox="250">
  <header class="qr-header">
    <div class="qr-title-block">
      <span>Leitura de QR Code</span>
      <h1 id="qrPageTitle">{{title}}</h1>
    </div>
    <a href="javascript:history.back()" class="btn btn-warning qr-back-button" rel="tooltip" title="Voltar">
      <i class="material-icons">keyboard_return</i>
      <span>Voltar</span>
    </a>
  </header>

  <section class="qr-reader-card">
    <div class="qr-reader-heading">
      <div>
        <span>Leitor ativo</span>
        <h2>Aproxime o QR Code da câmera</h2>
      </div>
      <i class="material-icons">qr_code_scanner</i>
    </div>

    <div class="qr-reader-tools" aria-label="Controles da câmera">
      <button type="button" class="qr-tool-button" data-qr-switch-camera hidden>
        <i class="material-icons" aria-hidden="true">cameraswitch</i>
        <span>Trocar câmera</span>
      </button>
      <button type="button" class="qr-tool-button" data-qr-toggle-torch hidden aria-pressed="false">
        <i class="material-icons" aria-hidden="true">flashlight_on</i>
        <span>Lanterna</span>
      </button>
      <span class="qr-camera-label" data-qr-camera-label>Preparando câmera...</span>
    </div>

    <button id="start" hidden>Start Scanning</button>
    <div id="reader" class="qr-reader"></div>
    <div id="scanned-result" class="qr-result" aria-live="polite" aria-atomic="true"></div>
  </section>

  <footer class="qr-footer">
    <span>&copy;2026, powered by SEMTEC-PMS</span>
    <small>Desenvolvido por Fernando (96) 99115-8611</small>
  </footer>
</main>

<script src="{{URL}}/resources/js/qr-reader.js?v=4"></script>
