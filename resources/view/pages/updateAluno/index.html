<div class="container pt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="update-check-card">
        <div class="text-center">
          <h5>{{title}}</h5>
          <h5>{{subtitle}}</h5>
          <h5>{{statusMessage}}</h5>
        </div>

        <form method="post" onsubmit="return validarPost()" class="mt-4">
          <div class="form-group">
            <label for="cpfAluno">CPF do aluno:</label>
            <input class="form-control-pessoal mascara-cpf cpfNovo" required type="text" id="cpfAluno" name="cpfAluno">
            <p class="update-check-hint">(APENAS ALUNOS QUE ESTÃO FREQUENTANDO AS AULAS)</p>
          </div>

          <div class="text-right form-actions">
            <button type="submit" class="btn btn-success btn-round btn-just-icon" id="novoAluno" rel="tooltip" title="Confirmar">
              <i class="material-icons">check</i>
            </button>
          </div>

          <div class="update-check-footer">
            <p>&copy;2022, desenvolvido por <i class="material-icons">developer_mode</i> Fernando (96) 99115-8611</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
