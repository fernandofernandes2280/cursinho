<div class="carteira-page">
	<div class="carteira-toolbar">
		<div>
			<p class="carteira-toolbar-kicker">Carteira digital</p>
			<h5>{{title}}</h5>
		</div>
		<div class="carteira-toolbar-actions">
			<button type="button" class="carteira-action carteira-action-primary" rel="tooltip" title="Download da Carteira" onclick="captureDown();">
				<i class="material-icons">download</i>
				<span>Baixar</span>
			</button>
			<a href="{{URL}}/aluno/update" class="carteira-action carteira-action-warning" rel="tooltip" title="Alterar dados da Carteira" {{hiddenBtnAlterar}}>
				<i class="material-icons">edit</i>
				<span>Alterar dados</span>
			</a>
			<a href="{{URL}}/aluno" class="carteira-action carteira-action-muted" rel="tooltip" title="Sair" {{hiddenBtnSairUpdate}}>
				<i class="material-icons">logout</i>
				<span>Sair</span>
			</a>
			<a href="javascript:history.back()" class="carteira-action carteira-action-muted" rel="tooltip" title="Sair" {{hiddenBtnSair}}>
				<i class="material-icons">logout</i>
				<span>Sair</span>
			</a>
		</div>
	</div>

	<form method="POST" enctype="multipart/form-data" id="myForm">
		<input type="hidden" name="img_val" id="img_val" value="" />
		<input type="hidden" name="matricula" value="{{matricula}}" />
		<input type="hidden" name="nome" value="{{nome}}" />
		<input type="hidden" name="opcao" id="opcao" value="" />
	</form>

	<div class="carteira-stage" aria-label="Prévia da carteira do aluno">
		{{carteiraCard}}
	</div>
</div>

{{carteiraStyles}}

<style>
.carteira-page,
.carteira-page * {
	box-sizing: border-box;
}

.carteira-page {
	min-height: 100vh;
	padding: 32px;
	background: #eef4f8;
	color: #1d2633;
	font-family: Inter, Arial, sans-serif;
}

.carteira-toolbar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 24px;
	max-width: 1120px;
	margin: 0 auto 24px;
}

.carteira-toolbar h5 {
	margin: 0;
	color: #111827;
	font-size: 24px;
	font-weight: 800;
	line-height: 1.2;
}

.carteira-toolbar-kicker {
	margin: 0 0 4px;
	color: #2f855a;
	font-size: 12px;
	font-weight: 800;
	letter-spacing: .08em;
	text-transform: uppercase;
}

.carteira-toolbar-actions {
	display: flex;
	align-items: center;
	justify-content: flex-end;
	gap: 10px;
	flex-wrap: wrap;
}

.carteira-action {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	min-height: 42px;
	padding: 0 15px;
	border: 0;
	border-radius: 8px;
	font-size: 14px;
	font-weight: 800;
	text-decoration: none;
	cursor: pointer;
	box-shadow: 0 12px 24px rgba(17, 24, 39, .12);
	transition: transform .2s ease, box-shadow .2s ease;
}

.carteira-action:hover {
	transform: translateY(-1px);
	text-decoration: none;
	box-shadow: 0 16px 28px rgba(17, 24, 39, .16);
}

.carteira-action .material-icons {
	font-size: 20px;
}

.carteira-action-primary {
	background: #1f7a3f;
	color: #fff;
}

.carteira-action-warning {
	background: #f0b429;
	color: #1f2937;
}

.carteira-action-muted {
	background: #fff;
	color: #334155;
	border: 1px solid #d8e1ea;
	box-shadow: none;
}

.carteira-stage {
	max-width: 1120px;
	margin: 0 auto;
	overflow-x: auto;
	padding: 18px;
	background: rgba(255, 255, 255, .72);
	border: 1px solid #d8e1ea;
	border-radius: 18px;
	box-shadow: 0 24px 60px rgba(15, 23, 42, .12);
}

@media (max-width: 900px) {
	.carteira-page {
		padding: 18px;
	}

	.carteira-toolbar {
		align-items: flex-start;
		flex-direction: column;
	}

	.carteira-toolbar-actions {
		justify-content: flex-start;
	}

	.carteira-action span {
		display: none;
	}

	.carteira-action {
		width: 44px;
		padding: 0;
	}

	.carteira-stage {
		padding: 10px;
		border-radius: 14px;
	}
}
</style>

<script type="text/javascript">
	function drawRoundedRect(ctx, x, y, width, height, radius) {
		var size = Math.min(radius, width / 2, height / 2);

		ctx.beginPath();
		ctx.moveTo(x + size, y);
		ctx.lineTo(x + width - size, y);
		ctx.quadraticCurveTo(x + width, y, x + width, y + size);
		ctx.lineTo(x + width, y + height - size);
		ctx.quadraticCurveTo(x + width, y + height, x + width - size, y + height);
		ctx.lineTo(x + size, y + height);
		ctx.quadraticCurveTo(x, y + height, x, y + height - size);
		ctx.lineTo(x, y + size);
		ctx.quadraticCurveTo(x, y, x + size, y);
		ctx.closePath();
	}

	function roundPhotoOnCanvas(canvas) {
		var target = document.getElementById('target');
		var photo = target ? target.querySelector('.carteira-photo-frame img') : null;

		if (!canvas || !target || !photo) {
			return canvas;
		}

		var targetRect = target.getBoundingClientRect();
		var photoRect = photo.getBoundingClientRect();

		if (!targetRect.width || !targetRect.height || !photoRect.width || !photoRect.height) {
			return canvas;
		}

		var scaleX = canvas.width / targetRect.width;
		var scaleY = canvas.height / targetRect.height;
		var x = Math.round((photoRect.left - targetRect.left) * scaleX);
		var y = Math.round((photoRect.top - targetRect.top) * scaleY);
		var width = Math.round(photoRect.width * scaleX);
		var height = Math.round(photoRect.height * scaleY);
		var computedStyle = window.getComputedStyle ? window.getComputedStyle(photo) : null;
		var radius = computedStyle ? parseFloat(computedStyle.borderTopLeftRadius) || 14 : 14;
		var scaledRadius = Math.round(radius * Math.min(scaleX, scaleY));
		var ctx = canvas.getContext('2d');
		var photoCanvas = document.createElement('canvas');
		var photoCtx = photoCanvas.getContext('2d');

		photoCanvas.width = width;
		photoCanvas.height = height;
		photoCtx.drawImage(canvas, x, y, width, height, 0, 0, width, height);

		ctx.fillStyle = '#ffffff';
		ctx.fillRect(x, y, width, height);
		ctx.save();
		drawRoundedRect(ctx, x, y, width, height, scaledRadius);
		ctx.clip();
		ctx.drawImage(photoCanvas, x, y);
		ctx.restore();

		return canvas;
	}

	function capture() {
		$('#target').html2canvas({
			allowTaint: true,
			onrendered: function(canvas) {
				roundPhotoOnCanvas(canvas);
				$('#img_val').val(canvas.toDataURL("image/png"));
				document.getElementById("opcao").value = "view";
				document.getElementById("myForm").submit();
			}
		});
	}

	function captureDown() {
		$('#target').html2canvas({
			allowTaint: true,
			onrendered: function(canvas) {
				roundPhotoOnCanvas(canvas);
				$('#img_val').val(canvas.toDataURL("image/png"));
				document.getElementById("opcao").value = "down";
				document.getElementById("myForm").submit();
			}
		});
	}
</script>
